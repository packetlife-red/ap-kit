// レッスン本文に差し込む「動く図」。
//
// 作った理由は、利用者からの
//   「画面がずっと同じで、考えるのにも同じ内容に見えて頭に入りづらかった」
// というフィードバック。文章は良くても、**紙芝居が1枚も動かない**のが問題だった。
//
// 方針は2つ。
//   1. 図そのものが順番に組み上がる（一度に全部出さない）。読む速度に絵が付いてくる
//   2. ページごとに絵が違う。「別の話に入った」ことが目で分かる
//
// レッスン側は `v: 'bits-101'` のように文字列で指定するだけにしてある。
// 図の実装をレッスン本文（lessons.js）に持ち込まないため。

// 図はすべて「箱を並べて、順番に光らせる」で表現する。
// 追加のライブラリは使わない（外部依存ゼロの方針）。

// ---------------------------------------------------------------------
// 部品
// ---------------------------------------------------------------------

// 桁の重み（1・2・4・8…）を並べたビット列。
// bits: '1011' のような文字列。weights を出すかどうかを opts で切り替える。
function bitRow(bits, opts = {}) {
  const arr = String(bits).split('');
  const n = arr.length;
  const cells = arr
    .map((b, i) => {
      const w = Math.pow(2, n - 1 - i); // 左の桁ほど重い
      const on = b === '1';
      // data-step は「何番目に光るか」。CSSのアニメーション遅延に使う。
      return `
        <div class="bit ${on ? 'on' : 'off'}" style="--i:${i}">
          ${opts.weight === false ? '' : `<div class="bit-w">${w}</div>`}
          <div class="bit-b">${b}</div>
          ${opts.sum && on ? `<div class="bit-plus">+${w}</div>` : ''}
        </div>`;
    })
    .join('');
  return `<div class="bit-row${opts.sum ? ' with-sum' : ''}">${cells}</div>`;
}

// 電球のならび（スイッチが2状態しかない、の説明用）
function lampRow(pattern) {
  const cells = String(pattern)
    .split('')
    .map((b, i) => {
      const on = b === '1';
      return `
        <div class="lamp ${on ? 'on' : 'off'}" style="--i:${i}">
          <div class="lamp-bulb"></div>
          <div class="lamp-cap">${on ? '入' : '切'}</div>
          <div class="lamp-num">${b}</div>
        </div>`;
    })
    .join('');
  return `<div class="lamp-row">${cells}</div>`;
}

// 桁の重みが2倍ずつ伸びていく階段。
function ladder(values, opts = {}) {
  const max = Math.max(...values);
  const cells = values
    .map((v, i) => {
      const h = Math.max(8, Math.round((v / max) * 100));
      return `
        <div class="lad" style="--i:${i};--h:${h}%">
          <div class="lad-bar"><span></span></div>
          <div class="lad-v">${v}</div>
        </div>`;
    })
    .join('');
  return `
    <div class="ladder">
      ${cells}
      ${opts.note ? `<div class="lad-note">${opts.note}</div>` : ''}
    </div>`;
}

// 10進数の位取りを分解して見せる（347 = 300 + 40 + 7）
function decimalBreak(num) {
  const digits = String(num).split('');
  const n = digits.length;
  const rows = digits
    .map((d, i) => {
      const w = Math.pow(10, n - 1 - i);
      return `
        <div class="dec-row" style="--i:${i}">
          <span class="dec-d">${d}</span>
          <span class="dec-x">×</span>
          <span class="dec-w">${w}</span>
          <span class="dec-eq">=</span>
          <span class="dec-v">${Number(d) * w}</span>
        </div>`;
    })
    .join('');
  return `
    <div class="dec-break">
      ${rows}
      <div class="dec-sum" style="--i:${n}">合計 ${num}</div>
    </div>`;
}

// バイトとビットの大きさの違い（1バイト＝8ビット）
function byteBit() {
  const bits = Array.from({ length: 8 }, (_, i) => `<span class="bb-bit" style="--i:${i}"></span>`).join('');
  return `
    <div class="bytebit">
      <div class="bb-side">
        <div class="bb-label">1バイト</div>
        <div class="bb-box byte">B</div>
      </div>
      <div class="bb-eq">=</div>
      <div class="bb-side">
        <div class="bb-label">8ビット</div>
        <div class="bb-box bits">${bits}</div>
      </div>
    </div>`;
}

// 帯グラフで「送るデータ量」と「1秒で送れる量」を比べる
function pipe(dataMbit, speedMbps) {
  const sec = dataMbit / speedMbps;
  const chunks = Array.from(
    { length: Math.min(Math.round(sec), 12) },
    (_, i) => `<span class="pp-chunk" style="--i:${i}"></span>`
  ).join('');
  return `
    <div class="pipe">
      <div class="pp-line"><span class="pp-label">送るデータ</span><b>${dataMbit} Mビット</b></div>
      <div class="pp-line"><span class="pp-label">1秒で送れる量</span><b>${speedMbps} Mビット</b></div>
      <div class="pp-track">${chunks}</div>
      <div class="pp-foot">1秒ぶんの塊が <b>${sec}</b> 個 → <b>${sec}秒</b></div>
    </div>`;
}

// ---------------------------------------------------------------------
// 登録表
// ---------------------------------------------------------------------
//
// レッスン本文からは、この名前で呼ぶ。
// 存在しない名前が来たら「図なし」として静かに無視する（本文は必ず読める）。

// 触れる2進数。桁をタップして0/1を切り替えると、合計が即座に変わる。
//
// 見るだけの図との違いは「自分で作れる」こと。
// 「10を作ってみて」と言われて自分で組めたときに、初めて手が覚える。
// お題を出して、当たったらその場で褒める（採点はしない・記録もしない）。
const bitsPlay = {
  html() {
    const cells = [8, 4, 2, 1]
      .map(
        (w, i) => `
        <button type="button" class="bit bp-cell off" data-w="${w}" style="--i:${i}"
                aria-pressed="false" aria-label="${w}の桁">
          <span class="bit-w">${w}</span>
          <span class="bit-b">0</span>
        </button>`
      )
      .join('');
    return `
      <div class="bitplay">
        <div class="bp-task" id="bp-task"></div>
        <div class="bit-row bp-row" id="bp-row">${cells}</div>
        <div class="bp-sum" id="bp-sum"></div>
        <div class="bp-msg" id="bp-msg"></div>
        <div class="row bp-actions">
          <button type="button" class="btn subtle" id="bp-clear">ぜんぶ0に戻す</button>
          <span class="spacer"></span>
          <button type="button" class="btn" id="bp-next">別のお題</button>
        </div>
      </div>`;
  },

  mount(root) {
    const q = (s) => root.querySelector(s);
    const cells = Array.from(root.querySelectorAll('.bp-cell'));
    if (!cells.length) return null;

    // お題は暗算できる範囲だけ。0と15は「全部0／全部1」で当たってしまうので入れない。
    const TASKS = [10, 5, 13, 6, 9, 12, 3, 7, 11, 14];
    let taskIndex = 0;
    let cleared = false;

    function value() {
      return cells.reduce(
        (sum, c) => sum + (c.classList.contains('on') ? Number(c.dataset.w) : 0),
        0
      );
    }

    function render() {
      const v = value();
      const bits = cells.map((c) => (c.classList.contains('on') ? '1' : '0')).join('');
      const parts = cells
        .filter((c) => c.classList.contains('on'))
        .map((c) => c.dataset.w);

      q('#bp-sum').innerHTML = parts.length
        ? `<b>${bits}</b> ＝ ${parts.join(' + ')} ＝ <b class="bp-v">${v}</b>`
        : `<b>${bits}</b> ＝ <b class="bp-v">0</b>　<span class="muted">（1が1つも立っていない）</span>`;

      const target = TASKS[taskIndex];
      const msg = q('#bp-msg');
      if (v === target && !cleared) {
        cleared = true;
        msg.className = 'bp-msg ok';
        msg.textContent = `そのとおり。${target} は ${bits} です。`;
      } else if (v !== target) {
        cleared = false;
        msg.className = 'bp-msg';
        msg.textContent = '';
      }
    }

    function setTask(i) {
      taskIndex = i % TASKS.length;
      cleared = false;
      q('#bp-task').innerHTML = `<b>${TASKS[taskIndex]}</b> を2進数で作ってみてください`;
      render();
    }

    cells.forEach((c) => {
      c.addEventListener('click', () => {
        const on = c.classList.toggle('on');
        c.classList.toggle('off', !on);
        c.setAttribute('aria-pressed', String(on));
        c.querySelector('.bit-b').textContent = on ? '1' : '0';
        render();
      });
    });

    q('#bp-clear').addEventListener('click', () => {
      cells.forEach((c) => {
        c.classList.remove('on');
        c.classList.add('off');
        c.setAttribute('aria-pressed', 'false');
        c.querySelector('.bit-b').textContent = '0';
      });
      render();
    });

    q('#bp-next').addEventListener('click', () => setTask(taskIndex + 1));

    setTask(0);
    return null; // タイマーを持たないので後始末は不要
  },
};

const VISUALS = {
  // --- 2進数 ---
  'bits-play': bitsPlay,
  'lamp-switch': () => lampRow('10110'),
  'dec-347': () => decimalBreak(347),
  'ladder-2x': () =>
    ladder([1, 2, 4, 8, 16, 32, 64, 128], { note: '左へ1桁ごとに2倍' }),
  'bits-1011': () => bitRow('1011', { sum: true }),
  'bits-weights': () => bitRow('00000000'),

  // --- 伝送時間 ---
  'byte-bit': () => byteBit(),
  'pipe-80-20': () => pipe(80, 20),

  // --- 稼働率 ---
  'chain-serial': () => `
    <div class="chain">
      <div class="ch-node" style="--i:0">装置A</div>
      <div class="ch-link" style="--i:1"></div>
      <div class="ch-node" style="--i:2">装置B</div>
      <div class="ch-cap" style="--i:3">どちらか1つ止まれば、全体が止まる</div>
    </div>`,
  'chain-parallel': () => `
    <div class="chain parallel">
      <div class="ch-branch">
        <div class="ch-node" style="--i:0">装置A</div>
        <div class="ch-node" style="--i:1">装置B</div>
      </div>
      <div class="ch-cap" style="--i:2">どちらか1つ動いていれば、全体は動く</div>
    </div>`,
};

// 図のHTMLを返す。未定義なら空文字（本文だけが出る）。
function visualHtml(name) {
  const fn = VISUALS[name];
  if (!fn) return '';
  const html = typeof fn === 'function' ? fn() : fn.html();
  return `<div class="lv" data-v="${name}">${html}</div>`;
}

// 図に動きを付ける。
// 触れる図（bits-play など）は mount を持ち、描画後に呼ぶ必要がある。
// 見るだけの図は mount を持たないので、ここは何もしない。
function visualMount(name, root) {
  const fn = VISUALS[name];
  if (!fn || typeof fn === 'function' || !fn.mount) return null;
  return fn.mount(root) || null;
}

// 検証用：定義済みの図の名前一覧
function visualNames() {
  return Object.keys(VISUALS);
}

// ===== src/learn/app.js ==========================================
// 「はじめから」モードの画面。
//
// ドリル側（ui/app.js）とは方針が正反対なので、あえて別ファイルにしてある。
//   ドリル … 即採点し、正誤を記録し、次の問題へ流す
//   ここ　 … read/walk は採点しない。try で間違えても答えを出さず、
//            ヒントを足して同じ問題をもう一度やらせる
//
// 「間違い＝罰」にしないための作りなので、成績（store の stats）には一切書かない。
// 記録するのは「どのレッスンをどこまで進んだか」だけ。



// ui/app.js と同名にすると単一スコープで衝突するため、learn層は接頭辞を付ける
const $l = (sel, root = document) => root.querySelector(sel);

function lesc(s) {
  return String(s).replace(/[&<>"']/g, (c) => {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 本文の軽量マークアップ。**太字** と改行のみ（ui/app.js と同じ方針）。
function md(s) {
  return lesc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

// --- 進捗の保存 ---------------------------------------------------------
// 形: { [lessonId]: { read: bool, walk: bool, done: bool } }

const PROGRESS = 'learn-progress';

function getProgress() {
  return store.get(PROGRESS, {}) || {};
}

function markProgress(lessonId, key) {
  store.update(
    PROGRESS,
    (p) => {
      const all = p || {};
      all[lessonId] = Object.assign({}, all[lessonId], { [key]: true });
      return all;
    },
    {}
  );
}

// --- 画面状態 -----------------------------------------------------------

const view = {
  lesson: null, // 開いているレッスン
  stage: 'read', // read / walk / try / done
  page: 0, // read の何ページ目か
  walkStep: 0, // walk の何問目か
  tryIndex: 0, // try の何問目か
  tryMisses: 0, // 今の問題で何回間違えたか（ヒントの出し方を変える）
};

function host() {
  return $l('#learn-host');
}

// 「3 / 5」という数字より、点が埋まっていくほうが進み具合が体感しやすい。
function dotsHtml(total, at) {
  const dots = Array.from({ length: total }, (_, i) => {
    const cls = i < at ? 'done' : i === at ? 'now' : '';
    return `<span class="rd ${cls}"></span>`;
  }).join('');
  return `${dots}<span class="rd-num">${at + 1} / ${total}</span>`;
}

// =======================================================================
// 一覧
// =======================================================================

function renderList() {
  const p = getProgress();

  const cards = LESSONS.map((l, i) => {
    const st = p[l.id] || {};
    const label = st.done ? 'もう一度' : st.read || st.walk ? 'つづきから' : 'はじめる';
    const badge = st.done
      ? '<span class="lc-done">修了</span>'
      : `<span class="lc-min">${l.minutes}分</span>`;

    return `
      <button class="lesson-card${st.done ? ' is-done' : ''}" data-lesson="${lesc(l.id)}">
        <span class="lc-no">${i + 1}</span>
        <span class="lc-main">
          <span class="lc-title">${lesc(l.title)}</span>
          <span class="lc-sub">${lesc(l.subtitle)}</span>
        </span>
        <span class="lc-right">${badge}<span class="lc-go">${label}</span></span>
      </button>`;
  }).join('');

  host().innerHTML = `
    <div class="panel learn-intro">
      <h2>はじめから</h2>
      <p>
        用語をひとつも知らない状態から読み始められます。<br>
        <b>読む → 一緒に解く → 自分で解く</b> の順に進むので、いきなり問題は出ません。
      </p>
      <p class="muted">
        ここでの正誤は成績に記録されません。間違えても大丈夫です。
      </p>
    </div>
    <div class="lesson-list">${cards}</div>
    <p class="muted" style="margin-top:18px;text-align:center">
      ひととおり終えたら「ドリル」タブで本番の問題に挑戦してみてください。
    </p>
  `;

  host()
    .querySelectorAll('[data-lesson]')
    .forEach((b) => b.addEventListener('click', () => openLesson(b.dataset.lesson)));
}

function openLesson(id) {
  view.lesson = getLesson(id);
  view.stage = 'read';
  view.page = 0;
  view.walkStep = 0;
  view.tryIndex = 0;
  view.tryMisses = 0;
  render();
}

// =======================================================================
// 共通の枠
// =======================================================================

const STAGE_LABEL = { read: '読む', walk: '一緒に解く', try: '自分で解く', done: '修了' };

function frame(inner) {
  const l = view.lesson;
  const order = ['read', 'walk', 'try'];
  const at = order.indexOf(view.stage);

  const dots = order
    .map((s, i) => {
      const cls = view.stage === 'done' || i < at ? 'ok' : i === at ? 'now' : '';
      return `<span class="pg-step ${cls}">${STAGE_LABEL[s]}</span>`;
    })
    .join('<span class="pg-line" aria-hidden="true"></span>');

  return `
    <div class="panel">
      <div class="lesson-head">
        <button class="btn back" id="learn-back">← 一覧</button>
        <div class="lh-title">
          <strong>${lesc(l.title)}</strong>
          <span class="muted">${lesc(l.subtitle)}</span>
        </div>
      </div>
      <div class="progress-bar" role="group" aria-label="進み具合">${dots}</div>
      ${inner}
    </div>`;
}

function render() {
  if (!view.lesson) return renderList();
  if (view.stage === 'read') renderRead();
  else if (view.stage === 'walk') renderWalk();
  else if (view.stage === 'try') renderTry();
  else renderDone();

  const back = $l('#learn-back');
  if (back) back.addEventListener('click', () => renderList());
  window.scrollTo({ top: 0 });
}

// =======================================================================
// ① 読む
// =======================================================================

function renderRead() {
  const l = view.lesson;
  const total = l.read.length;
  const pageData = l.read[view.page];
  const last = view.page === total - 1;

  // ページ番号を data 属性で持たせ、ページごとに見出しの色みを変える。
  // 「さっきと同じ画面に見える」対策で、番号が変われば必ず見た目が変わる。
  host().innerHTML = frame(`
    <div class="read-page enter" data-page="${view.page % 4}">
      <div class="read-dots">${dotsHtml(total, view.page)}</div>
      <h3>${lesc(pageData.h)}</h3>
      ${pageData.v ? visualHtml(pageData.v) : ''}
      <div class="read-body">${md(pageData.b)}</div>
    </div>
    <div class="row" style="margin-top:18px">
      ${view.page > 0 ? '<button class="btn" id="read-prev">戻る</button>' : ''}
      <span class="spacer"></span>
      <button class="btn primary" id="read-next">${last ? '一緒に解いてみる →' : '次へ'}</button>
    </div>
  `);

  // 触れる図はここで動き出す（見るだけの図では何も起きない）
  if (pageData.v) {
    const box = host().querySelector('.lv');
    if (box) visualMount(pageData.v, box);
  }

  const prev = $l('#read-prev');
  if (prev) prev.addEventListener('click', () => { view.page--; render(); });

  $l('#read-next').addEventListener('click', () => {
    if (last) {
      markProgress(l.id, 'read');
      view.stage = 'walk';
    } else {
      view.page++;
    }
    render();
  });
}

// =======================================================================
// ② 一緒に解く（採点しない）
// =======================================================================

function renderWalk() {
  const l = view.lesson;
  const w = l.walk;
  const total = w.steps.length;
  const s = w.steps[view.walkStep];
  const finished = view.walkStep >= total;

  if (finished) {
    host().innerHTML = frame(`
      <div class="walk-wrap enter">
        <div class="walk-q">${md(w.question)}</div>
        <div class="ex trap" style="margin-top:16px">
          <h4><span class="ex-icon" aria-hidden="true">✓</span>まとめ</h4>
          <div class="ex-body">${md(w.wrap)}</div>
        </div>
      </div>
      <div class="row" style="margin-top:18px">
        <span class="spacer"></span>
        <button class="btn primary" id="walk-done">自分で解いてみる →</button>
      </div>
    `);
    $l('#walk-done').addEventListener('click', () => {
      markProgress(l.id, 'walk');
      view.stage = 'try';
      view.tryIndex = 0;
      view.tryMisses = 0;
      render();
    });
    return;
  }

  host().innerHTML = frame(`
    <div class="walk-wrap enter">
      ${view.walkStep === 0 ? `<div class="walk-intro">${md(w.intro)}</div>` : ''}
      <div class="walk-q">${md(w.question)}</div>
      <div class="walk-step enter" data-step="${view.walkStep}">
        <div class="ws-count"><b>ステップ</b>${dotsHtml(total, view.walkStep)}</div>
        <div class="ws-ask">${md(s.ask)}</div>
        <div class="choices" id="walk-choices"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn subtle" id="walk-peek">答えを見る</button>
        </div>
        <div class="walk-why hidden" id="walk-why"></div>
      </div>
    </div>
  `);

  const box = $l('#walk-choices');
  s.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.type = 'button';
    b.setAttribute('aria-label', c);
    b.innerHTML = `<span class="val">${lesc(c)}</span>`;
    b.addEventListener('click', () => revealWalk(i));
    box.appendChild(b);
  });

  $l('#walk-peek').addEventListener('click', () => revealWalk(null));
}

// walk では「不正解」を出さない。選んだものが違っていても、
// 正解を示して理由を読ませ、そのまま次へ進ませる（ここは練習ではなく解説）。
function revealWalk(picked) {
  const s = view.lesson.walk.steps[view.walkStep];
  const btns = Array.from(host().querySelectorAll('#walk-choices .choice'));
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === s.ok) b.classList.add('correct');
    else if (i === picked) b.classList.add('dim');
  });

  const peek = $l('#walk-peek');
  if (peek) peek.classList.add('hidden');

  const why = $l('#walk-why');
  why.classList.remove('hidden');
  why.innerHTML = `
    <div class="ws-why">${md(s.why)}</div>
    <div class="row" style="margin-top:12px">
      <span class="spacer"></span>
      <button class="btn primary" id="walk-next">次へ</button>
    </div>`;
  $l('#walk-next').addEventListener('click', () => { view.walkStep++; render(); });
}

// =======================================================================
// ③ 自分で解く（間違えても答えを出さない）
// =======================================================================

function renderTry() {
  const l = view.lesson;
  const total = l.try.length;
  const t = l.try[view.tryIndex];

  host().innerHTML = frame(`
    <div class="try-wrap enter">
      <div class="try-count">${view.tryIndex + 1} 問目 / ${total}</div>
      <div class="try-q">${md(t.q)}</div>
      <div class="try-hint"><b>ヒント</b><br>${md(t.hint)}</div>
      <div class="choices" id="try-choices"></div>
      <div class="try-result hidden" id="try-result"></div>
    </div>
  `);

  const box = $l('#try-choices');
  t.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.type = 'button';
    b.setAttribute('aria-label', c);
    b.innerHTML = `<span class="val">${lesc(c)}</span>`;
    b.addEventListener('click', () => judgeTry(i));
    box.appendChild(b);
  });
}

function judgeTry(picked) {
  const l = view.lesson;
  const t = l.try[view.tryIndex];
  const box = $l('#try-result');

  if (picked !== t.ok) {
    // 間違えたときは正解を出さない。選んだ肢だけ落として、もう一度選ばせる。
    // 初学者にとって「不正解です、正解はイでした」は学習ではなく通告になるため。
    //
    // 2回目以降は hint2（答えを含まない、より噛み砕いた誘導）に切り替える。
    // ここで t.after を出すと答えそのものが漏れる（実際にそのバグを踏んだ）。
    view.tryMisses++;
    const b = host().querySelectorAll('#try-choices .choice')[picked];
    b.disabled = true;
    b.classList.add('dim');

    const guide = view.tryMisses === 1 ? t.hint : t.hint2 || t.hint;

    box.classList.remove('hidden');
    box.innerHTML = `
      <div class="try-again">
        <b>${view.tryMisses === 1 ? 'おしい。もう一度考えてみましょう。' : 'あと少しです。'}</b><br>
        ${md(guide)}
      </div>`;
    return;
  }

  // 正解
  const btns = host().querySelectorAll('#try-choices .choice');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === t.ok) b.classList.add('correct');
  });

  const last = view.tryIndex === l.try.length - 1;
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="try-ok">${view.tryMisses === 0 ? 'そのとおりです' : 'できました'}</div>
    <div class="try-after">${md(t.after)}</div>
    <div class="row" style="margin-top:14px">
      <span class="spacer"></span>
      <button class="btn primary" id="try-next">${last ? 'まとめを見る →' : '次の問題 →'}</button>
    </div>`;

  $l('#try-next').addEventListener('click', () => {
    if (last) {
      markProgress(l.id, 'done');
      view.stage = 'done';
    } else {
      view.tryIndex++;
      view.tryMisses = 0;
    }
    render();
  });
}

// =======================================================================
// ④ 修了
// =======================================================================

function renderDone() {
  const l = view.lesson;
  const idx = LESSONS.findIndex((x) => x.id === l.id);
  const nextLesson = LESSONS[idx + 1];

  host().innerHTML = frame(`
    <div class="done-wrap enter">
      <div class="done-mark">修了</div>
      <div class="done-body">${md(l.done)}</div>
      <div class="done-actions">
        <button class="btn primary" id="done-drill">本番の問題を解いてみる</button>
        ${nextLesson ? `<button class="btn" id="done-next">次のレッスン：${lesc(nextLesson.subtitle)}</button>` : ''}
        <button class="btn subtle" id="done-list">一覧に戻る</button>
      </div>
    </div>
  `);

  $l('#done-drill').addEventListener('click', () => {
    // ドリルタブへ渡す。ui/app.js が拾って分野を絞り込む。
    window.dispatchEvent(new CustomEvent('ap:drill', { detail: { genId: l.drillId } }));
  });

  const nx = $l('#done-next');
  if (nx) nx.addEventListener('click', () => openLesson(nextLesson.id));

  $l('#done-list').addEventListener('click', () => renderList());
}

// =======================================================================

function mountLearn() {
  renderList();
}

// ===== src/ui/app.js =============================================
// 画面まわり。ここだけがDOMに触る層。
// 将来React等へ載せ替えるときは、このファイルを捨てて core/ をそのまま使う。





const CHOICE_LABELS = ['ア', 'イ', 'ウ', 'エ'];

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

// XSS対策というより、問題文に <> が入っても壊れないようにするため。
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// --- 状態 ---------------------------------------------------------------

const state = {
  current: null, // 現在の問題
  answered: false,
  selected: new Set(), // 有効な分野ID
};

// --- タブ ---------------------------------------------------------------

let currentTab = null;

function showTab(name) {
  $$('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $$('[data-panel]').forEach((p) => p.classList.toggle('hidden', p.dataset.panel !== name));
  if (name === 'stats') renderStats();
  // 実際にタブが変わったときだけ先頭へ戻す。
  // 初回表示や同じタブの再描画でスクロール位置を動かすと、読んでいる途中で飛んでしまう。
  if (currentTab !== null && currentTab !== name) window.scrollTo({ top: 0 });
  currentTab = name;
  store.set('last-tab', name);
}

// --- 分野フィルタ -------------------------------------------------------

function loadSelection() {
  const saved = store.get('filters', null);
  const ids = allGenerators().map((g) => g.id);
  if (Array.isArray(saved) && saved.length) {
    const valid = saved.filter((id) => ids.indexOf(id) >= 0);
    state.selected = new Set(valid.length ? valid : ids);
  } else {
    state.selected = new Set(ids);
  }
}

function saveSelection() {
  store.set('filters', Array.from(state.selected));
}

function renderFilters() {
  const box = $('#filters');
  box.innerHTML = '';

  const all = document.createElement('button');
  all.className = 'chip';
  all.textContent = 'すべて';
  all.setAttribute('aria-pressed', String(state.selected.size === allGenerators().length));
  all.addEventListener('click', () => {
    const gens = allGenerators();
    state.selected = state.selected.size === gens.length ? new Set([gens[0].id]) : new Set(gens.map((g) => g.id));
    saveSelection();
    renderFilters();
  });
  box.appendChild(all);

  for (const g of allGenerators()) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = g.name;
    b.setAttribute('aria-pressed', String(state.selected.has(g.id)));
    b.addEventListener('click', () => {
      if (state.selected.has(g.id)) {
        // 最後の1つは外させない（出題できなくなるため）
        if (state.selected.size > 1) state.selected.delete(g.id);
      } else {
        state.selected.add(g.id);
      }
      saveSelection();
      renderFilters();
    });
    box.appendChild(b);
  }
}

// --- 出題 ---------------------------------------------------------------

function pickGeneratorId() {
  const ids = allGenerators()
    .map((g) => g.id)
    .filter((id) => state.selected.has(id));
  const pool = ids.length ? ids : allGenerators().map((g) => g.id);
  return pool[Math.floor(Math.random() * pool.length)];
}

function nextQuestion(fixed) {
  const genId = (fixed && fixed.genId) || pickGeneratorId();
  const seed = (fixed && fixed.seed) != null ? fixed.seed : randomSeed();

  try {
    state.current = generate(genId, seed);
  } catch (e) {
    // 1つのジェネレータが失敗しても画面全体は止めない
    $('#question').innerHTML =
      `<p class="verdict ng">問題の生成に失敗しました（${esc(genId)}）</p>` +
      `<p class="muted">${esc(e && e.message ? e.message : e)}</p>`;
    return;
  }
  state.answered = false;
  renderQuestion();
}

function renderQuestion() {
  const q = state.current;
  const el = $('#question');

  el.innerHTML = `
    <div class="qmeta">
      <span class="badge">${esc(q.generatorName)}</span>
      <span>${esc(q.category)}</span>
      <span class="spacer"></span>
      <span title="この番号を控えると同じ問題を再現できます">seed: ${q.seed}</span>
    </div>
    ${q.svg ? `<div class="figure">${q.svg}</div>` : ''}
    <div class="qtext">${esc(q.question)}</div>
    ${q.hint ? `<div class="hint">ヒント：${esc(q.hint)}</div>` : ''}
    <div class="choices" id="choices"></div>
    <div class="result hidden" id="result"></div>
  `;

  const box = $('#choices');
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.type = 'button';
    // 選択肢の中身は span で組んでいるが、それだけだとスクリーンリーダーや
    // 自動テストから「名前のないボタン」に見えるので、明示的にラベルを付ける。
    b.setAttribute('aria-label', `${CHOICE_LABELS[i]}、${c}`);
    b.innerHTML = `<span class="mark" aria-hidden="true">${CHOICE_LABELS[i]}</span><span class="val">${esc(c)}</span>`;
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });

  $('#next').textContent = '次の問題';
}

function answer(index) {
  if (state.answered) return;
  state.answered = true;

  const q = state.current;
  const ok = index === q.answerIndex;

  recordAnswer({ generatorId: q.generatorId, ok, seed: q.seed });

  // 選択肢の見た目を確定させ、誤答には「なぜ間違えるか」を出す。
  // 正解しても他の選択肢の理由を読めるようにしておく（ここが復習の中心）。
  $$('#choices .choice').forEach((b, i) => {
    b.disabled = true;
    const meta = q.choiceMeta[i];
    if (i === q.answerIndex) {
      b.classList.add('correct');
    } else if (i === index) {
      b.classList.add('wrong');
    } else {
      b.classList.add('dim');
    }
    if (!meta.correct && meta.why) {
      const why = document.createElement('span');
      why.className = 'why';
      why.textContent = meta.why;
      b.querySelector('.val').appendChild(why);
    }
  });

  const r = $('#result');
  r.classList.remove('hidden');

  // 式だけを並べたブロック。explain がある分野では折りたたみに退避する
  // （公式を知っている人の確認用であって、これから覚える人の読み物ではないため）。
  const stepsHtml = `
    <ul class="steps">
      ${q.steps
        .map((s) => {
          const v =
            s.value === null || s.value === undefined
              ? ''
              : `<span class="eq">= ${esc(fmtStepValue(s.value))}${esc(s.unit || '')}</span>`;
          return `<li><span class="lbl">${esc(s.label)}</span><span class="expr">${esc(s.expr)}</span>${v}</li>`;
        })
        .join('')}
    </ul>`;

  const hasExplain = q.explain && q.explain.length;

  r.innerHTML = `
    <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解' : `不正解　正解は ${CHOICE_LABELS[q.answerIndex]}：${esc(q.answerText)}`}</div>
    ${hasExplain ? renderExplain(q.explain) : stepsHtml}
    ${
      hasExplain
        ? `<details class="formula"><summary>式だけを見る</summary>${stepsHtml}</details>`
        : ''
    }
    ${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}
  `;

  // 解説を読ませたいので、ここでフォーカスやスクロールを動かさない。
  // 以前 $('#next').focus() を呼んでいたが、ブラウザがボタン位置まで
  // 自動スクロールしてしまい、答え合わせの直後に画面が飛んでいた。
}

// --- 教える解説 ---------------------------------------------------------

const EXPLAIN_KIND = {
  ask: { icon: '?', cls: 'ask' },
  why: { icon: '!', cls: 'why-block' },
  calc: { icon: '=', cls: 'calc' },
  trap: { icon: '×', cls: 'trap' },
};

// 解説本文の軽量マークアップ。**太字** と改行だけを通す。
// esc() を通したあとに置換するので、本文に <b> と書かれていても実体参照のまま残る。
function fmtExplainBody(s) {
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\n/g, '<br>');
}

function renderExplain(blocks) {
  return `<div class="explain">${blocks
    .map((b) => {
      const k = EXPLAIN_KIND[b.kind] || EXPLAIN_KIND.why;
      return `
        <section class="ex ${k.cls}">
          <h4><span class="ex-icon" aria-hidden="true">${k.icon}</span>${esc(b.title)}</h4>
          <div class="ex-body">${fmtExplainBody(b.body)}</div>
        </section>`;
    })
    .join('')}</div>`;
}

// 解説中の数値表示。桁が多いときだけ丸める（元の値を壊さない範囲で）。
function fmtStepValue(v) {
  if (typeof v !== 'number') return String(v);
  if (!Number.isFinite(v)) return String(v);
  if (Number.isInteger(v)) return v.toLocaleString('ja-JP');

  // 極端に小さい値をそのまま String() に渡すと "5e-7" になる。
  // 初学者にはこの表記自体が読めないので、必ず小数で書き下す。
  // （ページフォールト率の解説で実際に 5e-7 が出ていた）
  const abs = Math.abs(v);
  if (abs < 0.01) {
    // 有効数字が消えない桁数まで伸ばす。toFixed は指数表記にならない
    const digits = Math.min(12, Math.ceil(-Math.log10(abs)) + 2);
    return v.toFixed(digits).replace(/0+$/, '').replace(/\.$/, '');
  }

  // 4桁で丸めたうえで、桁区切りを入れる（12345.6789 → 12,345.6789）
  const r = Math.round(v * 10000) / 10000;
  return r.toLocaleString('ja-JP', { maximumFractionDigits: 4 });
}

// --- 成績 ---------------------------------------------------------------

// 間違えた問題の一覧。
//
// seed を保存してあるので、押せば**同じ数字の問題が完全に再現**できる。
// 「解いたきり」で終わらせず、間違えたものだけを潰しに戻れるようにする。
//
// 解き直して正解すると recent から消える（recordAnswer が ok:true を積むため、
// ここでは「その seed の最新の記録が誤答か」だけを見る）。
function renderMisses(stats, gens) {
  const box = $('#stats-misses');
  if (!box) return;

  const nameOf = {};
  for (const g of gens) nameOf[g.id] = g.name;

  // 同じ seed を何度も解いている場合、最新の結果だけを採用する。
  // 解き直して正解したものが一覧に残り続けると、潰した実感が出ないため。
  const items = [];
  for (const id in stats) {
    const seen = new Set();
    for (const r of stats[id].recent || []) {
      const key = id + ':' + r.seed;
      if (seen.has(key)) continue; // recent は新しい順なので、最初に見たものが最新
      seen.add(key);
      if (!r.ok) items.push({ genId: id, seed: r.seed, ts: r.ts });
    }
  }

  if (!items.length) {
    box.innerHTML =
      '<p class="muted" style="margin:0">まだ間違えた問題はありません。</p>';
    return;
  }

  items.sort((a, b) => b.ts - a.ts);

  box.innerHTML = `
    <div class="miss-list">
      ${items
        .slice(0, 30)
        .map(
          (m) => `
        <button class="miss" data-gen="${esc(m.genId)}" data-seed="${m.seed}">
          <span class="miss-main">
            <span class="miss-gen">${esc(nameOf[m.genId] || m.genId)}</span>
            <span class="miss-when">${fmtWhen(m.ts)}</span>
          </span>
          <span class="miss-go">もう一度 →</span>
        </button>`
        )
        .join('')}
    </div>`;

  box.querySelectorAll('.miss').forEach((b) => {
    b.addEventListener('click', () => {
      const genId = b.dataset.gen;
      const seed = Number(b.dataset.seed);
      // 分野の絞り込みは触らない。「この1問だけ解き直す」ためのボタンなので、
      // ここでフィルタを書き換えると、次の問題から分野が変わってしまう。
      nextQuestion({ genId, seed });
      showTab('drill');
    });
  });
}

// 「いつ間違えたか」をざっくり出す。正確な時刻は要らない。
function fmtWhen(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'たった今';
  if (min < 60) return `${min}分前`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h}時間前`;
  const d = Math.floor(h / 24);
  return `${d}日前`;
}

function renderStats() {
  const stats = getStats();
  const gens = allGenerators();

  let total = 0;
  let correct = 0;
  for (const id in stats) {
    total += stats[id].total;
    correct += stats[id].correct;
  }

  $('#stats-summary').innerHTML = `
    <div class="readout">
      <div class="stat"><div class="k">解いた問題</div><div class="v">${total}</div></div>
      <div class="stat"><div class="k">正解</div><div class="v">${correct}</div></div>
      <div class="stat accent"><div class="k">正答率</div><div class="v">${
        total ? Math.round((correct / total) * 100) : 0
      }%</div></div>
    </div>
  `;

  renderMisses(stats, gens);

  const rows = gens
    .map((g) => {
      const s = stats[g.id] || { correct: 0, total: 0 };
      const rate = s.total ? s.correct / s.total : null;
      return { g, s, rate };
    })
    // 正答率が低い順（＝苦手な分野）を上に。未挑戦は最後。
    .sort((a, b) => {
      if (a.rate === null && b.rate === null) return 0;
      if (a.rate === null) return 1;
      if (b.rate === null) return -1;
      return a.rate - b.rate;
    });

  $('#stats-table').innerHTML = `
    <table class="stats">
      <thead><tr><th>分野</th><th>正解 / 出題</th><th>正答率</th></tr></thead>
      <tbody>
        ${rows
          .map(
            ({ g, s, rate }) => `
          <tr>
            <td>${esc(g.name)}<span class="bar"><span style="width:${
              rate === null ? 0 : Math.round(rate * 100)
            }%"></span></span></td>
            <td class="num">${s.correct} / ${s.total}</td>
            <td class="num">${rate === null ? '—' : Math.round(rate * 100) + '%'}</td>
          </tr>`
          )
          .join('')}
      </tbody>
    </table>
  `;
}

// --- 起動 ---------------------------------------------------------------

function boot() {
  loadSelection();
  renderFilters();

  $$('.tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('#next').addEventListener('click', () => nextQuestion());
  $('#retry').addEventListener('click', () => {
    if (state.current) nextQuestion({ genId: state.current.generatorId, seed: state.current.seed });
  });
  $('#reset-stats').addEventListener('click', () => {
    if (confirm('成績をすべて消去します。よろしいですか？')) {
      resetStats();
      renderStats();
    }
  });

  // シミュレータから「この分野を解く」で飛んでくる
  window.addEventListener('ap:drill', (e) => {
    const genId = e.detail && e.detail.genId;
    if (genId) {
      state.selected = new Set([genId]);
      saveSelection();
      renderFilters();
      nextQuestion({ genId });
    }
    showTab('drill');
  });

  mountSimulators();
  mountLearn();
  nextQuestion();

  // 初回は「はじめから」で開く。いきなり4択が飛んでくると、まだ習っていない人には
  // 当てずっぽうしかできず、間違いを突きつけられるだけになるため。
  // 一度でもドリルを使った人には、以前見ていたタブを復元する。
  const lastTab = store.get('last-tab', null);
  showTab(lastTab === 'drill' || lastTab === 'sim' || lastTab === 'stats' ? lastTab : 'learn');
}

// ===== src/ui/main.js ============================================
// エントリポイント。ビルドはここから依存をたどる。

boot();

</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
