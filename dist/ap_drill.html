  return {
    question: `${bits}ビットで符号なし整数を表すとき、表せる最大の値はいくらか。`,
    hint: '全ビットが1のときが最大。2^ビット数 は「個数」であって最大値ではない。',
    answer: answerMax,
    distractors: [
      { value: noMinus1, why: '1を引いていない。0から数え始めるので最大値は 2^n − 1。' },
      { value: asSigned, why: '符号付きとして考えている。設問は符号なしなので符号ビットは不要。' },
      { value: asSignedNoMinus, why: '符号付きとして考えたうえに1も引いていない。' },
    ],
    format: (v) => fmtNum(v, 0),
    steps: [
      step('表せる個数', `2^${bits}`, Math.pow(2, bits), '通り'),
      step('0から数えるので', `2^${bits} − 1`, answerMax),
    ],
    note: `範囲は 0 〜 ${answerMax}。「個数」と「最大値」が1ずれることに注意。`,
  };
}

// --- シフト演算 ---------------------------------------------------------
function genShift(rng) {
  const shift = rng.int(1, 4);
  const left = rng.bool();

  // 右シフトのとき、元の値が小さいと答えが0に潰れる。
  // 「シフト数を1つ多く数える」ミスの値まで0になり、誤答が作れなくなるため、
  // 右シフトでは 2^(shift+1) より十分大きい値だけを使う（結果が必ず2以上になる）。
  const min = left ? 3 : Math.pow(2, shift + 1) * 2;
  const value = rng.int(min, min + 200);

  const answer = left ? value * Math.pow(2, shift) : Math.floor(value / Math.pow(2, shift));

  const opposite = left ? Math.floor(value / Math.pow(2, shift)) : value * Math.pow(2, shift);
  const byShift = left ? value * shift : Math.floor(value / shift); // 2^nでなくnを掛ける
  const offByOne = left ? value * Math.pow(2, shift + 1) : Math.floor(value / Math.pow(2, shift + 1));
  // シフト数を1つ少なく数えるミス。上の offByOne と逆方向なので、片方が潰れても残る
  const offByOneUnder = left
    ? value * Math.pow(2, Math.max(1, shift - 1))
    : Math.floor(value / Math.pow(2, Math.max(1, shift - 1)));
  // 10進の桁をずらすミス（2進なのに10倍・1/10で考える）
  const decimalShift = left ? value * 10 : Math.floor(value / 10);

  return {
    question:
      `10進数の ${value} を2進数で表し、${left ? '左' : '右'}に ${shift} ビット` +
      `${left ? '論理シフト' : '算術シフト'}した。結果を10進数で表すといくらか。` +
      `${left ? 'なお、桁あふれは起こらないものとする。' : 'なお、あふれたビットは切り捨てる。'}`,
    hint: `1ビット${left ? '左' : '右'}シフトは${left ? '2倍' : '2で割る'}のと同じ。`,
    answer,
    distractors: [
      { value: opposite, why: `シフトの向きが逆。${left ? '左シフトは大きく' : '右シフトは小さく'}なる。` },
      { value: byShift, why: `ビット数そのものを${left ? '掛けて' : '割って'}いる。正しくは2のシフト数乗。` },
      { value: offByOne, why: 'シフト数を1つ多く数えている。' },
      { value: offByOneUnder, why: 'シフト数を1つ少なく数えている。' },
      { value: decimalShift, why: '10進数の桁でずらしている。2進数のシフトは2倍・1/2。' },
    ],
    format: (v) => fmtNum(v, 0),
    steps: [
      step('2進数表記', value.toString(2), null),
      step(`${shift}ビット${left ? '左' : '右'}シフト`, answer.toString(2), null),
      step('10進数に戻す', `${value} ${left ? '×' : '÷'} 2^${shift}`, answer),
    ],
    note: `nビットの${left ? '左' : '右'}シフトは2^n${left ? '倍' : 'で割る'}のと同じ。掛け算・割り算の高速化に使われる。`,
  };
}

// ===== src/core/generators/pert.js ===============================
// PERT / アローダイアグラム（クリティカルパス）
// 落とし穴：最早結合点時刻は「入ってくる作業の最大値」、最遅は「出ていく作業の最小値」。
// ここを取り違えると全部ずれる。

register({
  id: 'pert',
  name: 'PERT・クリティカルパス',
  category: 'マネジメント系',
  tags: ['PERT', 'アローダイアグラム', 'クリティカルパス', '余裕日数'],

  gen(rng) {
    return rng.pick([genCritical, genFloat, genDelay])(rng);
  },
});

// ネットワークの形は固定し、日数だけを乱数にする。
// 図の描画とロジックを毎回作り直さずに済み、かつ「同じ形でも答えが変わる」ので暗記が効かない。
//
//        B
//   A →(2)→   D
//  (1)  ↓    (4)
//        C  ↗
//       (3)
//
// ノード: 1 → 2 → {3, 4} → 5
// 作業: A(1→2), B(2→3), C(2→4), D(3→5), E(4→5)
function buildNetwork(rng) {
  // 各作業の日数。パスの合計が一意に決まる（同着にならない）よう後で確認する。
  const d = {
    A: rng.int(2, 8),
    B: rng.int(2, 10),
    C: rng.int(2, 10),
    D: rng.int(2, 8),
    E: rng.int(2, 8),
  };

  // 2本のパス: A→B→D と A→C→E
  const path1 = d.A + d.B + d.D;
  const path2 = d.A + d.C + d.E;

  return { d, path1, path2 };
}

// 同着のネットワークは「クリティカルパスはどれか」の答えが一意にならないので引き直す。
function buildDistinctNetwork(rng, minGap = 1) {
  for (let i = 0; i < 40; i++) {
    const net = buildNetwork(rng);
    if (Math.abs(net.path1 - net.path2) >= minGap) return net;
  }
  return { d: { A: 3, B: 8, C: 4, D: 6, E: 5 }, path1: 17, path2: 12 };
}

const TASKS = [
  { id: 'A', from: 1, to: 2 },
  { id: 'B', from: 2, to: 3 },
  { id: 'C', from: 2, to: 4 },
  { id: 'D', from: 3, to: 5 },
  { id: 'E', from: 4, to: 5 },
];

function taskTable(d) {
  return TASKS.map((t) => `　作業${t.id}：${t.from}→${t.to}、所要日数 ${d[t.id]}日`).join('\n');
}

// アローダイアグラムのSVG。UI側でそのまま埋め込む。
// 色は currentColor 系にして、ダークモードでも見えるようにする。
function diagram(d, highlight) {
  const on = (id) => (highlight && highlight.indexOf(id) >= 0 ? 'crit' : 'norm');
  return `<svg viewBox="0 0 420 200" class="pert-svg" role="img" aria-label="アローダイアグラム">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g class="edges" marker-end="url(#ah)">
    <line class="${on('A')}" x1="42"  y1="100" x2="118" y2="100"/>
    <line class="${on('B')}" x1="142" y1="88"  x2="198" y2="50"/>
    <line class="${on('C')}" x1="142" y1="112" x2="198" y2="150"/>
    <line class="${on('D')}" x1="242" y1="50"  x2="298" y2="88"/>
    <line class="${on('E')}" x1="242" y1="150" x2="298" y2="112"/>
  </g>
  <g class="labels">
    <text x="80"  y="92">A(${d.A})</text>
    <text x="160" y="62">B(${d.B})</text>
    <text x="160" y="148">C(${d.C})</text>
    <text x="272" y="62">D(${d.D})</text>
    <text x="272" y="148">E(${d.E})</text>
  </g>
  <g class="nodes">
    <circle cx="30"  cy="100" r="14"/><text x="30"  y="105" class="nd">1</text>
    <circle cx="130" cy="100" r="14"/><text x="130" y="105" class="nd">2</text>
    <circle cx="220" cy="40"  r="14"/><text x="220" y="45"  class="nd">3</text>
    <circle cx="220" cy="160" r="14"/><text x="220" y="165" class="nd">4</text>
    <circle cx="310" cy="100" r="14"/><text x="310" y="105" class="nd">5</text>
  </g>
</svg>`;
}

// --- 最短所要日数（クリティカルパス） -----------------------------------
function genCritical(rng) {
  const { d, path1, path2 } = buildDistinctNetwork(rng);

  const answer = Math.max(path1, path2);
  const shorter = Math.min(path1, path2);
  const sumAll = d.A + d.B + d.C + d.D + d.E; // 全作業を足す
  const withoutA = answer - d.A; // 共通部分を忘れる
  const avg = Math.round((path1 + path2) / 2);

  const critPath = path1 > path2 ? ['A', 'B', 'D'] : ['A', 'C', 'E'];

  return {
    question:
      `次のアローダイアグラムで表される作業がある。\n${taskTable(d)}\n` +
      `全ての作業を完了するのに必要な最短の日数は何日か。`,
    hint: 'すべての経路の所要日数を出し、その中で最も長いものが答え。',
    answer,
    distractors: [
      { value: shorter, why: '短いほうの経路を答えている。全作業の完了には長いほうを待つ必要がある。' },
      { value: sumAll, why: '全作業の日数を単純に合計している。並行して進む作業がある。' },
      { value: withoutA, why: '共通の作業Aを含めていない。すべての経路が作業Aを通る。' },
      { value: avg, why: '2つの経路の平均を取っている。最短所要日数は最長経路で決まる。' },
    ],
    format: (v) => `${fmtNum(v, 0)}日`,
    svg: diagram(d, critPath),
    steps: [
      step('経路1（A→B→D）', `${d.A} + ${d.B} + ${d.D}`, path1, '日'),
      step('経路2（A→C→E）', `${d.A} + ${d.C} + ${d.E}`, path2, '日'),
      step('最長の経路がクリティカルパス', `max(${path1}, ${path2})`, answer, '日'),
    ],
    note:
      `クリティカルパスは ${critPath.join('→')}（${answer}日）。` +
      `この経路上の作業が1日でも遅れると、全体が同じだけ遅れる。`,
  };
}

// --- 余裕日数（フロート） -----------------------------------------------
function genFloat(rng) {
  const { d, path1, path2 } = buildDistinctNetwork(rng, 2);

  const total = Math.max(path1, path2);
  const slack = Math.abs(path1 - path2);
  const answer = slack;

  const nonCrit = path1 > path2 ? ['C', 'E'] : ['B', 'D'];
  const nonCritLen = Math.min(path1, path2);

  const asTotal = total; // 全体日数を答える
  const asPath = nonCritLen; // 非クリティカル経路の長さ
  const halfSlack = Math.floor(slack / 2);
  const plusOne = slack + 1;

  return {
    question:
      `次のアローダイアグラムで表される作業がある。\n${taskTable(d)}\n` +
      `作業${nonCrit[0]}の余裕日数（トータルフロート）は何日か。`,
    hint: '全体の所要日数を変えずに、その作業をあと何日遅らせられるか。',
    answer,
    distractors: [
      { value: asPath, why: `作業${nonCrit[0]}を含む経路の所要日数を答えている。余裕はクリティカルパスとの差。` },
      { value: asTotal, why: '全体の所要日数を答えている。余裕日数は経路間の差。' },
      { value: plusOne, why: '1日多く見積もっている。差はちょうど経路長の引き算。' },
      { value: halfSlack, why: '差を半分にしている。余裕はそのまま差の分だけある。' },
    ],
    format: (v) => `${fmtNum(v, 0)}日`,
    svg: diagram(d, path1 > path2 ? ['A', 'B', 'D'] : ['A', 'C', 'E']),
    steps: [
      step('経路1（A→B→D）', `${d.A} + ${d.B} + ${d.D}`, path1, '日'),
      step('経路2（A→C→E）', `${d.A} + ${d.C} + ${d.E}`, path2, '日'),
      step('クリティカルパス', `max(${path1}, ${path2})`, total, '日'),
      step('余裕日数', `${total} − ${nonCritLen}`, answer, '日'),
    ],
    note:
      `作業${nonCrit.join('・')}のある経路は${nonCritLen}日で、クリティカルパスより${slack}日短い。` +
      `その分だけ遅らせても全体には影響しない。クリティカルパス上の作業の余裕は常に0。`,
  };
}

// --- 遅延の影響 ---------------------------------------------------------
function genDelay(rng) {
  const { d, path1, path2 } = buildDistinctNetwork(rng, 2);

  const total = Math.max(path1, path2);
  const critFirst = path1 > path2 ? 'B' : 'C'; // クリティカルパス上の作業
  const delay = rng.int(2, 5);

  const answer = total + delay; // クリティカルパス上なのでそのまま延びる
  const noChange = total; // 影響しないと考える
  const slack = Math.abs(path1 - path2);
  // 「もう一方の経路の余裕日数の分だけ吸収される」と誤解するミス。
  // 注：もう一方の経路＋遅延（Math.min(path1,path2)+delay）は total と一致しやすいので誤答に使わない。
  const absorbed = total + Math.max(1, delay - slack);
  const doubled = total + delay * 2; // 遅延を二重に数える
  const justDelay = delay; // 遅延日数そのものを答える

  return {
    question:
      `次のアローダイアグラムで表される作業がある。\n${taskTable(d)}\n` +
      `作業${critFirst}が予定より ${delay} 日遅れた場合、全体の所要日数は何日になるか。`,
    hint: 'まず遅れた作業がクリティカルパス上にあるかを確認する。',
    answer,
    distractors: [
      { value: noChange, why: `作業${critFirst}はクリティカルパス上にあるため、遅れはそのまま全体に響く。` },
      { value: absorbed, why: '余裕日数で吸収されると考えている。クリティカルパス上の作業に余裕は0。' },
      { value: doubled, why: '遅延を二重に数えている。延びるのは遅れた日数分だけ。' },
      { value: justDelay, why: '遅延日数そのものを答えている。設問は全体の所要日数。' },
    ],
    format: (v) => `${fmtNum(v, 0)}日`,
    svg: diagram(d, path1 > path2 ? ['A', 'B', 'D'] : ['A', 'C', 'E']),
    steps: [
      step('元のクリティカルパス', `max(${path1}, ${path2})`, total, '日'),
      step(`作業${critFirst}は クリティカルパス上`, '余裕日数は0', null),
      step('全体の所要日数', `${total} + ${delay}`, answer, '日'),
    ],
    note:
      'クリティカルパス上の作業は余裕が0なので、遅れがそのまま全体の遅れになる。' +
      '逆に余裕のある作業なら、余裕の範囲内の遅れは全体に影響しない。',
  };
}

// ===== src/core/generators/disk.js ===============================
// 磁気ディスクのアクセス時間・RAIDの実効容量
// 落とし穴：回転待ち時間は「1回転の半分」（平均だから）。
// RAIDは方式ごとに「使える容量」と「壊れても平気な台数」が違う。


register({
  id: 'disk',
  name: 'ディスクアクセス・RAID',
  category: 'テクノロジ系',
  tags: ['アクセス時間', '回転待ち', 'シーク', 'RAID'],

  gen(rng) {
    return rng.pick([genAccess, genRaidCapacity, genThroughput])(rng);
  },
});

// --- アクセス時間 -------------------------------------------------------
function genAccess(rng) {
  // 回転数から1回転の時間を出す。実機に近い値を使う。
  const rpm = rng.pick([3600, 4200, 5400, 7200, 10000, 15000]);
  const rotMs = round(60000 / rpm, 4); // 1回転（ミリ秒）
  const halfRot = round(rotMs / 2, 4); // 平均回転待ち

  const seek = rng.pick([3, 4, 5, 8, 10, 12]); // 平均シーク時間（ミリ秒）
  const blockKB = rng.pick([4, 8, 16, 32]); // 1ブロックのサイズ
  const transferRate = rng.pick([20, 40, 50, 80, 100]); // Mバイト/秒

  // 転送時間(ms) = ブロックサイズ(KB) / 転送速度(MB/s) → KB/(1000KB/ms相当)
  const transfer = round((blockKB / 1024 / transferRate) * 1000, 4);

  const answer = round(seek + halfRot + transfer, 4);

  const fullRot = round(seek + rotMs + transfer, 4); // 回転待ちを1回転ぶんにする
  const noRot = round(seek + transfer, 4); // 回転待ちを忘れる
  const noSeek = round(halfRot + transfer, 4); // シークを忘れる
  const noTransfer = round(seek + halfRot, 4); // 転送時間を忘れる

  return {
    question:
      `回転数 ${rpm.toLocaleString('ja-JP')} 回転/分、平均シーク時間 ${seek} ミリ秒の磁気ディスクがある。\n` +
      `データ転送速度は ${transferRate} Mバイト/秒で、${blockKB} Kバイトのブロックを1つ読み出す。\n` +
      `平均アクセス時間は何ミリ秒か。`,
    hint: 'アクセス時間 = シーク時間 + 平均回転待ち時間 + 転送時間。回転待ちは1回転の半分。',
    answer,
    distractors: [
      { value: fullRot, why: '回転待ちを1回転ぶんにしている。「平均」なので半回転で計算する。' },
      { value: noRot, why: '回転待ち時間が抜けている。目的のセクタが来るまで待つ時間が必要。' },
      { value: noSeek, why: 'シーク時間が抜けている。まず目的のトラックまでヘッドを動かす。' },
      { value: noTransfer, why: '転送時間が抜けている。データを読み出す時間もかかる。' },
    ],
    format: (v) => `${fmtNum(v, 3)}ミリ秒`,
    steps: [
      step('1回転の時間', `60000 / ${rpm}`, rotMs, 'ミリ秒'),
      step('平均回転待ち', `${fmtNum(rotMs, 3)} / 2`, halfRot, 'ミリ秒'),
      step('転送時間', `${blockKB}KB / ${transferRate}MB/s`, transfer, 'ミリ秒'),
      step('合計', `${seek} + ${fmtNum(halfRot, 3)} + ${fmtNum(transfer, 3)}`, answer, 'ミリ秒'),
    ],
    note:
      '回転待ちが「半分」なのは、目的のセクタがどこにあるかは運次第で、' +
      '平均すると半回転ぶん待つことになるから。ここを1回転で計算するのが最頻出のミス。',
  };
}

// --- RAIDの実効容量 -----------------------------------------------------
function genRaidCapacity(rng) {
  const level = rng.pick(['RAID0', 'RAID1', 'RAID5', 'RAID6', 'RAID10']);
  const diskTB = rng.pick([1, 2, 4, 6, 8]);

  // 方式ごとに必要な最小台数と、使える容量の割合が違う。
  // 台数は3台以上にする（n=2 だと n−2=0 や n/2=n−1 になり誤答が潰れる）。
  const spec = {
    RAID0: { n: rng.int(3, 6), usable: (n) => n, desc: 'ストライピング（冗長性なし）' },
    RAID1: { n: 2, usable: () => 1, desc: 'ミラーリング（同じ内容を2台に書く）' },
    RAID5: { n: rng.int(3, 6), usable: (n) => n - 1, desc: 'パリティを1台ぶん分散' },
    RAID6: { n: rng.int(4, 7), usable: (n) => n - 2, desc: 'パリティを2台ぶん分散' },
    RAID10: { n: rng.pick([4, 6, 8]), usable: (n) => n / 2, desc: 'ミラーリング＋ストライピング' },
  }[level];

  const n = spec.n;
  const usable = spec.usable(n);
  const answer = round(usable * diskTB, 4);

  // 「他の方式だと思って計算した値」を誤答にする。
  // RAID0 は全ディスクが使えるため「合計を答えるミス」が正解と一致してしまうので、
  // 各候補は正解と異なるものだけが buildChoices に採用される（重複は自動で捨てられる）。
  const allDisks = round(n * diskTB, 4); // 冗長性を考えない（RAID0の答え）
  const halfAll = round((n / 2) * diskTB, 4); // 全部ミラーだと思う（RAID10の答え）
  const minusTwo = round((n - 2) * diskTB, 4); // パリティ2台ぶん（RAID6の答え）
  const minusOne = round((n - 1) * diskTB, 4); // パリティ1台ぶん（RAID5の答え）
  const oneDisk = round(diskTB, 4); // ミラーだと思う（RAID1の答え）
  const doubled = round(n * diskTB * 2, 4); // 容量を二重に数える

  return {
    question:
      `容量 ${diskTB} Tバイトのディスク ${n} 台で ${level} を構成する。\n` +
      `実際にデータを格納できる容量は何Tバイトか。`,
    hint: `${level} は${spec.desc}。冗長性のために使われるぶんは差し引く。`,
    answer,
    distractors: [
      { value: allDisks, why: '全ディスクの合計を答えている。冗長性のために使われるぶんが引かれていない。' },
      { value: minusOne, why: 'パリティを1台ぶんとして計算している（RAID5の考え方）。方式ごとの冗長分を確認する。' },
      { value: minusTwo, why: 'パリティを2台ぶんとして計算している（RAID6の考え方）。方式ごとの冗長分を確認する。' },
      { value: halfAll, why: '全体をミラーリングとして半分にしている（RAID10の考え方）。方式ごとに割合が違う。' },
      { value: oneDisk, why: '1台ぶんしか使えないと考えている（RAID1の考え方）。方式ごとの冗長分を確認する。' },
      { value: doubled, why: '容量を二重に数えている。実効容量が総容量を超えることはない。' },
    ],
    format: (v) => `${fmtNum(v, 2)}Tバイト`,
    steps: [
      step('方式', `${level}：${spec.desc}`, null),
      step('使えるディスク数', `${n}台のうち`, spec.usable(n), '台ぶん'),
      step('実効容量', `${spec.usable(n)} × ${diskTB}`, answer, 'Tバイト'),
    ],
    note:
      'RAID0＝全部使えるが冗長性ゼロ、RAID1＝半分、RAID5＝1台ぶん減、' +
      'RAID6＝2台ぶん減、RAID10＝半分。「何台まで壊れても大丈夫か」とセットで覚える。',
  };
}

// --- 単位時間あたりの処理件数 -------------------------------------------
function genThroughput(rng) {
  const rpm = rng.pick([5400, 7200, 10000, 15000]);
  const rotMs = round(60000 / rpm, 4);
  const halfRot = round(rotMs / 2, 4);
  const seek = rng.pick([4, 5, 8, 10]);
  const transfer = rng.pick([0.5, 1, 2]);

  const accessMs = round(seek + halfRot + transfer, 4);
  const answer = round(1000 / accessMs, 4); // 1秒あたりの処理件数

  const perMinute = round(60000 / accessMs, 4); // 分あたりで答える
  const inverted = round(accessMs / 1000, 4); // 逆数を取り違える
  const noHalf = round(1000 / (seek + rotMs + transfer), 4); // 回転待ちを1回転に

  return {
    question:
      `回転数 ${rpm.toLocaleString('ja-JP')} 回転/分、平均シーク時間 ${seek} ミリ秒、` +
      `1回の転送時間 ${fmtNum(transfer, 1)} ミリ秒のディスクがある。\n` +
      `このディスクは1秒間に最大何回のアクセスを処理できるか。`,
    hint: 'まず1回のアクセスにかかる時間を出し、1000ミリ秒をそれで割る。',
    answer,
    distractors: [
      { value: perMinute, why: '1分あたりの回数を答えている。設問は1秒あたり。' },
      { value: noHalf, why: '回転待ちを1回転ぶんで計算している。平均は半回転。' },
      { value: inverted, why: '割る向きが逆。1回にかかる時間ではなく、1秒に何回できるかを聞かれている。' },
    ],
    format: (v) => `${fmtNum(v, 1)}回`,
    steps: [
      step('平均回転待ち', `60000 / ${rpm} / 2`, halfRot, 'ミリ秒'),
      step('1回のアクセス時間', `${seek} + ${fmtNum(halfRot, 3)} + ${fmtNum(transfer, 1)}`, accessMs, 'ミリ秒'),
      step('1秒あたりの回数', `1000 / ${fmtNum(accessMs, 3)}`, answer, '回'),
    ],
    note: '「1回にかかる時間」から「1秒に何回できるか」を出すには、1000ミリ秒をその時間で割る。',
  };
}

// ===== src/core/generators/coding.js =============================
// 符号化・圧縮（ハフマン符号、平均符号長、圧縮率）
// 落とし穴：平均符号長は「出現率×符号長」の加重平均。
// 圧縮率は「圧縮後÷圧縮前」か「削減した割合」か、設問の定義を確認する。


register({
  id: 'coding',
  name: 'ハフマン符号・圧縮率',
  category: 'テクノロジ系',
  tags: ['ハフマン符号', '平均符号長', '圧縮率', '符号化'],

  gen(rng) {
    return rng.pick([genAvgLength, genCompression, genFixedVsVariable])(rng);
  },
});

// ハフマン木を実際に構築して符号長を求める。
// 手で木を書かなくても答えが出せるよう、結果だけを使う。
function huffmanLengths(freqs) {
  // ノード: { w, len } — len はそのノード配下の全記号の符号長を後で加算する
  const nodes = freqs.map((w, i) => ({ w, leaves: [i] }));
  const lengths = new Array(freqs.length).fill(0);

  const pool = nodes.slice();
  while (pool.length > 1) {
    // 重みの小さい2つを取り出す（同値なら添字の小さい方＝決定的にする）
    pool.sort((a, b) => a.w - b.w || a.leaves[0] - b.leaves[0]);
    const x = pool.shift();
    const y = pool.shift();
    // この2つをまとめる＝配下の全記号の符号長が1ずつ伸びる
    for (const i of x.leaves) lengths[i]++;
    for (const i of y.leaves) lengths[i]++;
    pool.push({ w: x.w + y.w, leaves: x.leaves.concat(y.leaves) });
  }
  return lengths;
}

// 出現率の組を作る。合計が1になり、ハフマン木が一意に決まりやすい形にする。
function makeFreqs(rng) {
  // 分母を100にして、偏りのある分布を作る（ハフマンが効く形）。
  //
  // 均等に近い分布（例 35/30/25/10）は全記号の符号長が同じになり、
  // 平均符号長＝単純平均＝最大＝最小＝固定長 と全て一致して誤答が作れない。
  // ハフマンを使う意味自体が薄い分布なので、出題としても外す。
  const patterns = [
    [50, 25, 13, 12],
    [40, 30, 20, 10],
    [45, 25, 20, 10],
    [55, 20, 15, 10],
    [60, 20, 12, 8],
    [50, 20, 15, 10, 5],
    [40, 25, 15, 12, 8],
    [45, 20, 15, 12, 8],
    [55, 15, 12, 10, 8],
  ];
  const p = rng.pick(patterns);
  const names = ['A', 'B', 'C', 'D', 'E'].slice(0, p.length);
  return names.map((name, i) => ({ name, pct: p[i] }));
}

// --- 平均符号長 ---------------------------------------------------------
function genAvgLength(rng) {
  const freqs = makeFreqs(rng);
  const lens = huffmanLengths(freqs.map((f) => f.pct));

  const answer = round(
    freqs.reduce((s, f, i) => s + (f.pct / 100) * lens[i], 0),
    4
  );

  const n = freqs.length;
  const fixedBits = Math.ceil(Math.log2(n)); // 固定長で表す場合のビット数
  const simpleAvg = round(lens.reduce((s, l) => s + l, 0) / n, 4); // 単純平均
  const maxLen = Math.max(...lens);
  const minLen = Math.min(...lens);

  const table = freqs
    .map((f, i) => `　${f.name}：出現率 ${f.pct}%、符号長 ${lens[i]}ビット`)
    .join('\n');

  return {
    question:
      `ある文字列を、次のハフマン符号で符号化した。\n${table}\n` +
      `1文字あたりの平均符号長は何ビットか。`,
    hint: '出現率を重みとした加重平均。よく出る文字ほど短い符号が割り当てられている。',
    answer,
    distractors: [
      { value: simpleAvg, why: '符号長の単純平均を取っている。出現率という重みを使っていない。' },
      { value: fixedBits, why: `${n}種類を固定長で表した場合のビット数。ハフマンは可変長なので短くなる。` },
      { value: maxLen, why: '最も長い符号の長さを答えている。平均は全体の重み付き和。' },
      { value: minLen, why: '最も短い符号の長さを答えている。平均は全体の重み付き和。' },
    ],
    format: (v) => `${fmtNum(v, 3)}ビット`,
    steps: [
      step('公式', '平均符号長 = Σ(出現率 × 符号長)', null),
      step(
        '代入',
        freqs.map((f, i) => `${fmtNum(f.pct / 100, 2)}×${lens[i]}`).join(' + '),
        answer,
        'ビット'
      ),
    ],
    note:
      `${n}種類を固定長で表すと${fixedBits}ビット必要だが、ハフマン符号なら平均${fmtNum(answer, 3)}ビット。` +
      `よく出る文字に短い符号を割り当てることで縮んでいる。`,
  };
}

// --- 圧縮率 -------------------------------------------------------------
function genCompression(rng) {
  // before=100 は避ける。削減量（Mバイト）と削減率（%）が同じ数値になり、
  // 「単位を取り違えるミス」が正解と区別できなくなる。
  const before = rng.pick([120, 150, 200, 240, 300, 400, 500, 600, 750, 800]);
  // ratio=0.5 も避ける。「圧縮後の割合」と「削減した割合」がどちらも50%で一致してしまう。
  const ratio = rng.pick([0.2, 0.25, 0.3, 0.4, 0.6, 0.75]);
  const after = round(before * ratio, 4);

  // 「圧縮率」の定義は問題文で明示する（曖昧さを残さない）
  const answer = round((1 - ratio) * 100, 4); // 削減した割合(%)

  const asRatio = round(ratio * 100, 4); // 圧縮後の割合を答える
  const asTimes = round((1 / ratio) * 100, 4); // 何倍縮んだかを%にする
  // 削減量（Mバイト）。before×(1−ratio) が ratio×100 と偶然一致する組があるため、
  // そのときは buildChoices 側で自動的に捨てられる。
  const asDiff = round(before - after, 4);
  const overAfter = round(((before - after) / after) * 100, 4); // 分母を圧縮後にする

  return {
    question:
      `${before} Mバイトのファイルを圧縮したところ、${fmtNum(after, 1)} Mバイトになった。\n` +
      `このときの圧縮率（元のサイズからどれだけ削減できたかの割合）は何%か。`,
    hint: '削減できた量が元のサイズの何%にあたるかを求める。',
    answer,
    distractors: [
      { value: asRatio, why: '圧縮後のサイズが元の何%かを答えている。設問は「削減できた割合」。' },
      { value: asDiff, why: '削減した量（Mバイト）を答えている。設問は割合（%）。' },
      { value: overAfter, why: '圧縮後のサイズを分母にしている。基準は圧縮前のサイズ。' },
      { value: asTimes, why: '元のサイズが圧縮後の何倍かを計算している。削減率とは別の指標。' },
    ],
    format: (v) => `${fmtNum(v, 1)}%`,
    steps: [
      step('削減できた量', `${before} − ${fmtNum(after, 1)}`, round(before - after, 4), 'Mバイト'),
      step('元のサイズに対する割合', `${fmtNum(before - after, 1)} / ${before}`, round(1 - ratio, 4)),
      step('%表記', `${fmtNum(1 - ratio, 4)} × 100`, answer, '%'),
    ],
    note:
      '「圧縮率」は文脈によって「圧縮後の割合」を指すこともある。' +
      '設問がどちらの定義かを必ず確認する（この問題は削減した割合）。',
  };
}

// --- 固定長との比較 -----------------------------------------------------
function genFixedVsVariable(rng) {
  const freqs = makeFreqs(rng);
  const lens = huffmanLengths(freqs.map((f) => f.pct));
  const n = freqs.length;

  const avg = freqs.reduce((s, f, i) => s + (f.pct / 100) * lens[i], 0);
  const fixedBits = Math.ceil(Math.log2(n));
  const chars = rng.int(10, 90) * 100; // 文字数

  // 削減できるビット数
  const answer = round(chars * (fixedBits - avg), 0);

  const totalHuffman = round(chars * avg, 0); // ハフマンでの総ビット数
  const totalFixed = round(chars * fixedBits, 0); // 固定長での総ビット数
  const perChar = round(fixedBits - avg, 4); // 1文字あたりの削減

  const table = freqs
    .map((f, i) => `　${f.name}：出現率 ${f.pct}%、符号長 ${lens[i]}ビット`)
    .join('\n');

  return {
    question:
      `${n}種類の文字からなる ${chars.toLocaleString('ja-JP')} 文字のデータがある。\n` +
      `固定長で符号化した場合と、次のハフマン符号を使った場合を比べる。\n${table}\n` +
      `ハフマン符号を使うと、全体で何ビット削減できるか。`,
    hint: `${n}種類なら固定長は${fixedBits}ビット。1文字あたりの差に文字数を掛ける。`,
    answer,
    distractors: [
      { value: totalHuffman, why: 'ハフマン符号での総ビット数を答えている。設問は削減できるビット数（差）。' },
      { value: totalFixed, why: '固定長での総ビット数を答えている。設問は削減できるビット数（差）。' },
      { value: perChar, why: '1文字あたりの削減ビット数で止まっている。文字数を掛ける。' },
    ],
    format: (v) => `${fmtNum(v, 0)}ビット`,
    steps: [
      step('固定長のビット数', `${n}種類 → 2^${fixedBits} ≧ ${n}`, fixedBits, 'ビット'),
      step('ハフマンの平均符号長', 'Σ(出現率 × 符号長)', round(avg, 4), 'ビット'),
      step('1文字あたりの削減', `${fixedBits} − ${fmtNum(avg, 4)}`, round(fixedBits - avg, 4), 'ビット'),
      step('全体の削減', `${chars} × ${fmtNum(fixedBits - avg, 4)}`, answer, 'ビット'),
    ],
    note:
      `固定長なら${totalFixed.toLocaleString('ja-JP')}ビット、ハフマンなら${totalHuffman.toLocaleString('ja-JP')}ビット。` +
      `出現率に偏りがあるほどハフマンの効果が大きくなる。`,
  };
}

// ===== src/core/generators/probability.js ========================
// 確率・期待値
// 落とし穴：条件付き確率で分母を全体にしてしまう、
// 「少なくとも1つ」を余事象で解かずに足し算してしまう。


register({
  id: 'probability',
  name: '確率・期待値',
  category: 'テクノロジ系',
  tags: ['確率', '条件付き確率', 'ベイズ', '期待値', '余事象'],

  gen(rng) {
    return rng.pick([genAtLeastOne, genConditional, genExpected])(rng);
  },
});

// --- 少なくとも1つ（余事象） --------------------------------------------
function genAtLeastOne(rng) {
  const n = rng.int(3, 6);
  // 故障率は「n個すべて無事」の確率が半端な値にならない範囲で選ぶ
  const p = rng.pick([0.01, 0.02, 0.05, 0.1, 0.2]);

  const noneFail = Math.pow(1 - p, n);
  const answer = round(1 - noneFail, 6);

  const summed = round(Math.min(p * n, 0.999999), 6); // 単純に足す
  const allFail = round(Math.pow(p, n), 6); // 全部故障する確率
  const complement = round(noneFail, 6); // 余事象を答えてしまう
  const exactlyOne = round(n * p * Math.pow(1 - p, n - 1), 6); // ちょうど1個

  return {
    question:
      `ある装置が1年以内に故障する確率は ${fmtPct(p, 0)} である。\n` +
      `この装置を ${n} 台使うシステムで、1年以内に少なくとも1台が故障する確率はいくらか。\n` +
      `なお、各装置の故障は互いに独立とする。`,
    hint: '「少なくとも1つ」は「1つも起きない」の余事象で考える。',
    answer,
    distractors: [
      { value: summed, why: '各装置の故障率を単純に足している。確率は足し算では合成できない（重複を二重に数える）。' },
      { value: complement, why: '「1台も故障しない確率」を答えている。最後に1から引く。' },
      { value: allFail, why: '「全台が故障する確率」を求めている。設問は「少なくとも1台」。' },
      { value: exactlyOne, why: '「ちょうど1台だけ故障する確率」。2台以上故障する場合も含める必要がある。' },
    ],
    format: (v) => fmtNum(v, 4),
    steps: [
      step('1台も故障しない確率', `(1 − ${fmtNum(p, 2)})^${n}`, round(noneFail, 6)),
      step('その余事象', `1 − ${fmtNum(noneFail, 6)}`, answer),
    ],
    note:
      `1台あたり${fmtPct(p, 0)}でも、${n}台あると${fmtPct(answer, 1)}まで上がる。` +
      `台数が増えるほど「どれかが壊れる」確率は急に高くなる — 直列構成の稼働率が下がる理由と同じ考え方。`,
  };
}

// --- 条件付き確率（ベイズ） ---------------------------------------------
function genConditional(rng) {
  // 検査の問題。数字は整数で割り切れるよう、母数を大きめに取る。
  const total = rng.pick([1000, 2000, 10000]);
  const defectRate = rng.pick([0.01, 0.02, 0.05]); // 不良品の割合
  const detectRate = rng.pick([0.9, 0.95, 0.98]); // 不良品を正しく検出する率
  const falseRate = rng.pick([0.02, 0.05, 0.1]); // 良品を誤って不良と判定する率

  const defective = total * defectRate;
  const good = total - defective;

  const truePositive = defective * detectRate; // 不良品で「不良」判定
  const falsePositive = good * falseRate; // 良品で「不良」判定
  const positive = truePositive + falsePositive; // 「不良」判定の総数

  const answer = round(truePositive / positive, 6); // 判定が不良のとき本当に不良の確率

  const asDetect = round(detectRate, 6); // 検出率と混同
  const asDefect = round(defectRate, 6); // 事前確率と混同
  const overTotal = round(truePositive / total, 6); // 分母を全体にする
  const inverted = round(falsePositive / positive, 6); // 誤検出のほうを答える

  return {
    question:
      `製品全体の ${fmtPct(defectRate, 0)} が不良品である。\n` +
      `検査装置は、不良品を ${fmtPct(detectRate, 0)} の確率で「不良」と判定するが、\n` +
      `良品も ${fmtPct(falseRate, 0)} の確率で誤って「不良」と判定してしまう。\n` +
      `ある製品が「不良」と判定されたとき、それが実際に不良品である確率はいくらか。`,
    hint: '「不良と判定された全体」を分母に、「本当に不良だったもの」を分子にする。',
    answer,
    distractors: [
      { value: asDetect, why: '検出率をそのまま答えている。これは「不良品が正しく判定される確率」で、向きが逆。' },
      { value: overTotal, why: '分母を製品全体にしている。条件付き確率の分母は「不良と判定されたもの」だけ。' },
      { value: asDefect, why: '全体の不良率（事前確率）を答えている。検査結果という条件が反映されていない。' },
      { value: inverted, why: '「不良と判定されたが実は良品」の確率。設問はその逆。' },
    ],
    format: (v) => fmtNum(v, 4),
    steps: [
      step(`${total.toLocaleString('ja-JP')}個で考える`, `不良品 ${defective} 個、良品 ${good} 個`, null),
      step('不良品で「不良」判定', `${defective} × ${fmtNum(detectRate, 2)}`, round(truePositive, 2), '個'),
      step('良品で「不良」判定', `${good} × ${fmtNum(falseRate, 2)}`, round(falsePositive, 2), '個'),
      step('「不良」判定の合計', `${fmtNum(truePositive, 2)} + ${fmtNum(falsePositive, 2)}`, round(positive, 2), '個'),
      step('そのうち本当に不良', `${fmtNum(truePositive, 2)} / ${fmtNum(positive, 2)}`, answer),
    ],
    note:
      `検出率${fmtPct(detectRate, 0)}と高性能に見えても、実際に不良である確率は${fmtPct(answer, 1)}にとどまる。` +
      `元の不良率が低いと、誤検出のほうが数で上回るため。具体的な個数で考えると直感的に分かる。`,
  };
}

// --- 期待値 -------------------------------------------------------------
function genExpected(rng) {
  const names = ['計画A', '計画B', '計画C', '計画D'];

  // 誤答が正解と衝突しない組が出るまで引き直す。
  // 「加重平均＝単純平均」「合計＝期待値」になる配分は実際に発生し、
  // 除外条件を数式で書き並べるより実値を比べるほうが確実（EVMで確立した方式）。
  let items, answer, simpleAvg, sum, maxProfit, onlyPositive;
  for (let attempt = 0; attempt < 40; attempt++) {
    const n = rng.int(3, 4);

    // 確率の合計が1になる組を作る（10%刻み）
    const parts = [];
    let rest = 10;
    for (let i = 0; i < n - 1; i++) {
      const max = rest - (n - 1 - i);
      parts.push(rng.int(1, Math.max(1, max)));
      rest -= parts[parts.length - 1];
    }
    parts.push(rest);

    // 利益は互いに異なる値にする（同値だと誤答が潰れる）
    const profits = rng.sample([-200, -100, -50, 100, 200, 300, 500, 800], n);

    items = names.slice(0, n).map((name, i) => ({ name, p: parts[i] / 10, profit: profits[i] }));

    answer = round(items.reduce((s, it) => s + it.p * it.profit, 0), 4);
    simpleAvg = round(profits.reduce((s, v) => s + v, 0) / n, 4);
    sum = round(profits.reduce((s, v) => s + v, 0), 4);
    maxProfit = round(Math.max(...profits), 4);
    onlyPositive = round(
      items.filter((it) => it.profit > 0).reduce((s, it) => s + it.p * it.profit, 0),
      4
    );

    // 正解を含めた5つの値がすべて異なれば、誤答が3つ残ることが保証される
    const vs = [answer, simpleAvg, sum, maxProfit, onlyPositive];
    if (new Set(vs.map((v) => v.toFixed(4))).size === vs.length) break;
  }

  const table = items
    .map((it) => `　${it.name}：確率 ${fmtPct(it.p, 0)}、損益 ${it.profit >= 0 ? '+' : '−'}${Math.abs(it.profit)}万円`)
    .join('\n');

  return {
    question:
      `ある投資について、起こりうる結果とその確率が次のとおり見込まれている。\n${table}\n` +
      `この投資の損益の期待値はいくらか。`,
    hint: '期待値 = Σ(確率 × その場合の値)。確率を重みとした加重平均。',
    answer,
    distractors: [
      { value: simpleAvg, why: '単純平均を取っている。確率という重みを使っていない。' },
      { value: sum, why: '損益を合計しただけ。期待値は確率を掛けてから足す。' },
      { value: onlyPositive, why: 'マイナスの結果を計算に入れていない。損失も期待値に含める。' },
      { value: maxProfit, why: '最もうまくいった場合の値を答えている。期待値は全ケースの重み付き平均。' },
    ],
    format: (v) => `${v >= 0 ? '+' : '−'}${fmtNum(Math.abs(v), 1)}万円`,
    steps: [
      step('公式', '期待値 = Σ(確率 × 損益)', null),
      step(
        '代入',
        items.map((it) => `${fmtNum(it.p, 1)}×(${it.profit})`).join(' + '),
        answer,
        '万円'
      ),
    ],
    note:
      answer >= 0
        ? `期待値がプラスなので、この投資を何度も繰り返せば平均的には利益が出る計算。`
        : `期待値がマイナスなので、繰り返すほど損失が積み上がる計算になる。`,
  };
}

// ===== src/core/generators/os.js =================================
// OS（ターンアラウンドタイム・ページング）
// 落とし穴：ターンアラウンドタイムは「到着から完了まで」で待ち時間を含む。
// ページングの実効アクセス時間は、フォールト率が極小でも影響が大きい。


register({
  id: 'os',
  name: 'ターンアラウンド・ページング',
  category: 'テクノロジ系',
  tags: ['ターンアラウンドタイム', 'スケジューリング', 'ページフォールト', '仮想記憶'],

  gen(rng) {
    return rng.pick([genTurnaround, genPageFault, genFaultRate])(rng);
  },
});

// --- ターンアラウンドタイム（到着順） -----------------------------------
function genTurnaround(rng) {
  // ジョブは到着時刻と処理時間を持つ。到着順（FCFS）で処理する。
  const n = 3;

  // 誤答（処理時間・待ち時間・完了時刻・平均）が正解と衝突しない組が出るまで引き直す。
  // 待ち時間0や、たまたま処理時間＝ターンアラウンドになる組が実際に発生する。
  let jobs, target, answer, asBurst, asWait, asFinish, avgTurn;
  for (let attempt = 0; attempt < 40; attempt++) {
    jobs = [];
    let t = 0;
    for (let i = 0; i < n; i++) {
      jobs.push({
        name: String.fromCharCode(65 + i),
        arrive: t,
        burst: rng.int(2, 12),
      });
      t += rng.int(1, 5); // 次のジョブは少しあとに到着
    }

    // FCFSで実行し、各ジョブの完了時刻を求める
    let clock = 0;
    for (const j of jobs) {
      clock = Math.max(clock, j.arrive) + j.burst;
      j.finish = clock;
      j.turnaround = j.finish - j.arrive;
      j.wait = j.turnaround - j.burst;
    }

    target = jobs[rng.int(1, n - 1)]; // 2番目以降（待ちが発生するもの）を問う
    answer = target.turnaround;

    asBurst = target.burst; // 処理時間だけを答える
    asWait = target.wait; // 待ち時間だけを答える
    asFinish = target.finish; // 完了時刻をそのまま答える
    avgTurn = round(jobs.reduce((s, j) => s + j.turnaround, 0) / n, 4);

    // 待ちが実際に発生していて、かつ4つの値が互いに異なることを求める
    const vs = [answer, asBurst, asWait, asFinish, avgTurn];
    if (target.wait > 0 && new Set(vs.map((v) => Number(v).toFixed(4))).size === vs.length) break;
  }

  const table = jobs
    .map((j) => `　ジョブ${j.name}：到着時刻 ${j.arrive}秒、処理時間 ${j.burst}秒`)
    .join('\n');

  return {
    question:
      `1つのCPUで、次の3つのジョブを到着順に処理する。\n${table}\n` +
      `ジョブ${target.name}のターンアラウンドタイムは何秒か。`,
    hint: 'ターンアラウンドタイム ＝ 完了時刻 − 到着時刻。待たされた時間も含む。',
    answer,
    distractors: [
      { value: asBurst, why: '処理時間だけを答えている。前のジョブを待った時間も含める。' },
      { value: asFinish, why: '完了時刻をそのまま答えている。到着時刻を引く必要がある。' },
      { value: asWait, why: '待ち時間だけを答えている。ターンアラウンドは待ち時間＋処理時間。' },
      { value: avgTurn, why: '3つのジョブの平均を答えている。設問は特定のジョブ。' },
    ],
    format: (v) => `${fmtNum(v, 1)}秒`,
    steps: [
      ...jobs.map((j) =>
        step(
          `ジョブ${j.name}`,
          `到着${j.arrive}秒 → 開始${j.finish - j.burst}秒 → 完了${j.finish}秒`,
          null
        )
      ),
      step(
        `ジョブ${target.name}のターンアラウンド`,
        `${target.finish} − ${target.arrive}`,
        answer,
        '秒'
      ),
    ],
    note:
      `ジョブ${target.name}は ${target.wait}秒 待たされてから ${target.burst}秒 かけて処理された。` +
      `到着順（FCFS）では、先に長いジョブが来ると後続が大きく待たされる。`,
  };
}

// --- ページングの実効アクセス時間 ---------------------------------------
function genPageFault(rng) {
  const memNs = rng.pick([50, 80, 100, 120]); // 主記憶アクセス時間（ナノ秒）
  const faultMs = rng.pick([2, 5, 8, 10]); // ページフォールト処理時間（ミリ秒）
  const faultRate = rng.pick([0.0001, 0.0005, 0.001, 0.002]); // フォールト率

  const faultNs = faultMs * 1e6; // ミリ秒 → ナノ秒
  const answer = round((1 - faultRate) * memNs + faultRate * faultNs, 2);

  // 「単位変換を忘れる」と「フォールトを無視する」は、フォールト率が極小のため
  // どちらも主記憶時間とほぼ同値になり、誤答として区別できない。
  // 代わりに、桁を取り違える／加重を掛け忘れるといった区別できるミスを使う。
  const swapped = round(faultRate * memNs + (1 - faultRate) * faultNs, 2); // 率を逆に
  const noWeight = round(memNs + faultNs, 2); // 確率を掛けずに単純に足す
  const kiloOnly = round((1 - faultRate) * memNs + faultRate * faultMs * 1e3, 2); // ミリ→マイクロ止まり
  const tenFold = round((1 - faultRate) * memNs + faultRate * faultNs * 10, 2); // 桁を1つ多く
  const onlyFault = round(faultRate * faultNs, 2); // 主記憶側を足し忘れ

  return {
    question:
      `主記憶のアクセス時間が ${memNs} ナノ秒、ページフォールト1回の処理に ${faultMs} ミリ秒かかる仮想記憶システムがある。\n` +
      `ページフォールト率が ${fmtNum(faultRate * 100, 4)}%（${faultRate}）のとき、実効アクセス時間は何ナノ秒か。`,
    hint: '加重平均。ただしミリ秒とナノ秒の単位を揃えてから計算する（1ミリ秒＝10⁶ナノ秒）。',
    answer,
    distractors: [
      { value: kiloOnly, why: 'ミリ秒→マイクロ秒までしか直していない。1ミリ秒＝1,000,000ナノ秒。' },
      { value: swapped, why: 'フォールト率とヒット率を逆に掛けている。ほとんどはフォールトしない。' },
      { value: onlyFault, why: 'フォールト側だけを計算している。フォールトしない大多数のアクセスも含める。' },
      { value: noWeight, why: '確率を掛けずに単純に足している。加重平均なのでそれぞれの発生率を掛ける。' },
      { value: tenFold, why: '桁を1つ多く見積もっている。1ミリ秒は10⁶ナノ秒。' },
    ],
    // 1998000.1ナノ秒 のような桁では比較できないので、大きければミリ秒に繰り上げる
    format: (v) => fmtNs(v),
    steps: [
      // 式の中に既に「= …ナノ秒」と書いているので、value は持たせない（二重表示になる）
      step('フォールト時間を揃える', `${faultMs} ミリ秒 = ${fmtInt(faultNs)} ナノ秒`, null),
      // 選択肢は fmtNs でマイクロ秒・ミリ秒に繰り上がる。
      // 解説の最終行もその表記で締めないと「解説の値と正解が違う」ように見えるため、
      // ナノ秒での計算結果を出したうえで、最後に単位を直した値を正解として置く。
      step(
        '加重平均',
        `${fmtNum(1 - faultRate, 5)}×${memNs} + ${faultRate}×${fmtInt(faultNs)}`,
        round(answer, 2),
        'ナノ秒'
      ),
      // 式の中に変換後の値を書いてあるので value は持たせない（持たせると二重表示になる）。
      // ただし検証は「値を持つ最後のstepが正解と一致すること」を見るので、
      // 上の加重平均ステップが answer と一致していることでその条件を満たしている。
      step('読みやすい単位に直す', `${fmtNum(answer, 2)} ナノ秒 = ${fmtNs(answer)}`, null),
    ],
    note:
      `フォールト率がわずか${fmtNum(faultRate * 100, 4)}%でも、実効アクセス時間は主記憶単体の` +
      `${fmtNum(answer / memNs, 1)}倍になる。フォールト1回のコストが桁違いに大きいため。`,
  };
}

// --- 許容できるフォールト率を逆算 ---------------------------------------
function genFaultRate(rng) {
  const memNs = rng.pick([50, 100]);
  const faultMs = rng.pick([2, 5, 10]);
  const faultNs = faultMs * 1e6;
  const targetRatio = rng.pick([1.1, 1.2, 1.5, 2.0]); // 実効時間を主記憶の何倍以内に収めたいか

  const targetNs = memNs * targetRatio;
  // targetNs = (1-f)*mem + f*fault  →  f = (targetNs - mem) / (fault - mem)
  const answer = round((targetNs - memNs) / (faultNs - memNs), 8);

  // (target−mem)/faultNs は、faultNs ≫ memNs のため正解とほぼ同値になり誤答にならない。
  // 桁や向きを取り違えるミスのうち、値がはっきり異なるものだけを使う。
  const inverted = round((faultNs - memNs) / (targetNs - memNs), 8); // 分子分母が逆
  const simple = round(memNs / faultNs, 8); // 目標値を使わない
  const noSub = round(targetNs / faultNs, 8); // 分子からmemを引き忘れ
  const tenFold = round(((targetNs - memNs) / (faultNs - memNs)) * 10, 8); // 桁を1つ間違える
  const asRatio = round(targetRatio, 8); // 倍率をそのまま答える

  return {
    question:
      `主記憶のアクセス時間が ${memNs} ナノ秒、ページフォールト1回の処理に ${faultMs} ミリ秒かかる。\n` +
      `実効アクセス時間を主記憶単体の ${fmtNum(targetRatio, 1)} 倍（${fmtNum(targetNs, 0)} ナノ秒）以内に抑えたい。\n` +
      `ページフォールト率はいくら以下であればよいか。`,
    hint: '実効 = (1−f)×主記憶 + f×フォールト を f について解く。',
    answer,
    distractors: [
      { value: noSub, why: '分子から主記憶時間を引いていない。増やせるのは「目標 − 主記憶」のぶんだけ。' },
      { value: tenFold, why: '桁が1つ大きい。この率ではフォールトが多すぎて目標を超えてしまう。' },
      { value: inverted, why: '分子と分母が逆。フォールト率は非常に小さい値になるはず。' },
      { value: simple, why: '主記憶時間をフォールト時間で割っただけ。目標値を使っていない。' },
      { value: asRatio, why: '目標の倍率をそのまま答えている。求めるのは率（非常に小さい値）。' },
    ],
    // 0.00025001 のような生値では大小の比較すらできないので、
    // 「%」と「何回に1回か」を併記して意味で選べるようにする。
    format: (v) => fmtSmallRate(v),
    steps: [
      step('目標の実効時間', `${memNs} × ${fmtNum(targetRatio, 1)}`, round(targetNs, 2), 'ナノ秒'),
      step('式を立てる', `${fmtInt(targetNs)} = (1−f)×${memNs} + f×${fmtInt(faultNs)}`, null),
      // 答えは 0.0000005 のような極端に小さい率。
      // 値は検証（最終ステップ＝正解）のために持たせたまま、読みやすさは
      // 次の「率の意味」ステップで補う。UI側の fmtStepValue が指数表記を
      // 展開するので、ここでは "5e-7" にはならない。
      step('fについて解く', `(${fmtInt(targetNs)} − ${memNs}) / (${fmtInt(faultNs)} − ${memNs})`, answer),
      step('この率の意味', `${fmtSmallRate(answer)}`, null),
    ],
    note:
      `許容できるフォールト率は${fmtNum(answer * 100, 6)}%。` +
      `${fmtInt(1 / answer)}回に1回しかフォールトしてはいけない計算になる。` +
      `仮想記憶ではフォールトをいかに減らすかが性能を決める。`,
  };
}

// ===== src/core/generators/evm.js ================================
// EVM（アーンドバリューマネジメント）
// 落とし穴：差異（SV/CV）は「EV −」から始まる。引く順序を逆にすると符号が反転する。
// 指数（SPI/CPI）は「EV ÷」。分子は常にEV。


register({
  id: 'evm',
  name: 'EVM（アーンドバリュー）',
  category: 'マネジメント系',
  tags: ['EVM', 'SPI', 'CPI', 'SV', 'CV', 'EAC'],

  gen(rng) {
    return rng.pick([genVariance, genIndex, genEac])(rng);
  },
});

// PV/EV/AC を作る。単位は万円。
// EVとPV、EVとACをそれぞれ別方向にずらして、指標が1をまたぐ問題も出るようにする。
function baseValues(rng) {
  // SVとCV（SPIとCPI）が同じ値になる組合せは、
  // 「もう一方を答えるミス」「符号や分母分子を逆にするミス」が誤答として成立しないため避ける。
  //
  // 除外条件は PV==AC、2EV==PV+AC、EV²==PV·AC など複数あり、
  // 数式で列挙すると漏れやすい。実際の差異・指数の値どうしを比べて
  // 全て異なる組が出るまで引き直すほうが確実。
  for (let attempt = 0; attempt < 60; attempt++) {
    const pv = rng.int(10, 60) * 10; // 100〜600万円
    // EV は PV の 70〜125%（100%は避ける＝差異0だと誤答が潰れる）
    const ev = round(pv * rng.pick([0.7, 0.8, 0.9, 1.1, 1.2, 1.25]), 0);
    const ac = round(ev * rng.pick([0.75, 0.8, 0.9, 1.1, 1.2, 1.25]), 0);

    const values = [
      ev - pv, // SV
      ev - ac, // CV
      pv - ev, // SVの符号違い
      ac - ev, // CVの符号違い
      pv - ac, // EVを使わないミス
    ];
    const ratios = [
      ev / pv, // SPI
      ev / ac, // CPI
      pv / ev, // SPIの逆数
      ac / ev, // CPIの逆数
      pv / ac, // EVを使わないミス
    ];

    // 判定は「画面に出る文字列」で行う。
    // round(v, 3) で区別できても、表示が fmtNum(v, 3) で丸められて同じ文字列になれば、
    // 利用者から見れば同じ選択肢であり buildChoices に捨てられる。
    // （実際 1.0995 と 1.1 がどちらも "1.1" と表示されて誤答が足りなくなっていた）
    const distinct = (arr, digits) =>
      new Set(arr.map((v) => fmtNum(v, digits))).size === arr.length;

    if (distinct(values, 1) && distinct(ratios, 3)) return { pv, ev, ac };
  }
  // 引き直しで見つからない確率は事実上ゼロだが、無限ループは避ける。
  // この値が上の条件を満たすことは確認済み。
  return { pv: 100, ev: 70, ac: 53 };
}

function situation(pv, ev, ac) {
  return (
    `あるプロジェクトの、ある時点での状況は次のとおりである。\n` +
    `　PV（計画価値）：${fmtManYen(pv)}\n` +
    `　EV（出来高）：${fmtManYen(ev)}\n` +
    `　AC（実コスト）：${fmtManYen(ac)}`
  );
}

// --- 差異（SV / CV） ----------------------------------------------------
function genVariance(rng) {
  const { pv, ev, ac } = baseValues(rng);
  const isSchedule = rng.bool();

  const answer = isSchedule ? round(ev - pv, 4) : round(ev - ac, 4);
  const flipped = -answer; // 引く順序が逆
  const other = isSchedule ? round(ev - ac, 4) : round(ev - pv, 4); // もう一方の差異
  const otherFlipped = -other;
  const wrongPair = round(pv - ac, 4); // EVを使わない

  const name = isSchedule ? 'SV（スケジュール差異）' : 'CV（コスト差異）';
  const formula = isSchedule ? 'SV = EV − PV' : 'CV = EV − AC';

  return {
    question: `${situation(pv, ev, ac)}\nこのプロジェクトの ${name} はいくらか。`,
    hint: '差異はどちらも「EV −」から始まる。スケジュールならPV、コストならACを引く。',
    answer,
    distractors: [
      { value: flipped, why: `引く順序が逆（${isSchedule ? 'PV − EV' : 'AC − EV'}）。符号が反転している。` },
      { value: other, why: `もう一方の差異（${isSchedule ? 'CV = EV − AC' : 'SV = EV − PV'}）を求めている。` },
      { value: wrongPair, why: 'PV − AC を計算している。差異の基準は常にEV（実際にできた分）。' },
      { value: otherFlipped, why: 'もう一方の差異を、さらに逆順で計算している。' },
    ],
    format: (v) => (v >= 0 ? `+${fmtManYen(v)}` : `−${fmtManYen(-v)}`),
    steps: [
      step('公式', formula, null),
      step('代入', `${fmtNum(ev, 0)} − ${fmtNum(isSchedule ? pv : ac, 0)}`, answer, '万円'),
    ],
    note:
      answer >= 0
        ? `プラスなので${isSchedule ? '予定より進んでいる' : '予算内に収まっている'}。差異は「プラスが良い」と覚える。`
        : `マイナスなので${isSchedule ? '予定より遅れている' : '予算を超過している'}。差異は「プラスが良い」と覚える。`,
  };
}

// --- 指数（SPI / CPI） --------------------------------------------------
function genIndex(rng) {
  const { pv, ev, ac } = baseValues(rng);
  const isSchedule = rng.bool();

  const answer = round(isSchedule ? ev / pv : ev / ac, 4);
  const flipped = round(isSchedule ? pv / ev : ac / ev, 4); // 分母分子が逆
  const other = round(isSchedule ? ev / ac : ev / pv, 4); // もう一方の指数
  const wrongPair = round(pv / ac, 4);
  // 表示は fmtNum(v,3) で末尾の0が落ちるため、生値が違っても "1.1" のように
  // 同じ文字列になって潰れる組がある（1.0995 と 1.1 で実際に発生した）。
  // 値が明確に離れる誤答を足して吸収する。
  const acOverPv = round(ac / pv, 4); // EVを使わず、逆向きに割る
  // 「1 − 指数」を答えてしまうミス（達成率と未達率の取り違え）
  const oneMinus = round(1 - (isSchedule ? ev / pv : ev / ac), 4);

  const name = isSchedule ? 'SPI（スケジュール効率指数）' : 'CPI（コスト効率指数）';
  const formula = isSchedule ? 'SPI = EV ÷ PV' : 'CPI = EV ÷ AC';

  return {
    question: `${situation(pv, ev, ac)}\nこのプロジェクトの ${name} はいくらか。`,
    hint: '指数はどちらも「EV ÷」。分子は常にEV。',
    answer,
    distractors: [
      { value: flipped, why: `分子と分母が逆（${isSchedule ? 'PV ÷ EV' : 'AC ÷ EV'}）。分子は常にEV。` },
      { value: other, why: `もう一方の指数（${isSchedule ? 'CPI = EV ÷ AC' : 'SPI = EV ÷ PV'}）を求めている。` },
      { value: wrongPair, why: 'PV ÷ AC を計算している。指数の基準は常にEV。' },
      { value: acOverPv, why: 'AC ÷ PV を計算している。EVが入っていないので出来高を評価できていない。' },
      { value: oneMinus, why: '1から引いている。指数はそのまま1と比べる値（1以上なら良好）。' },
    ],
    format: (v) => fmtNum(v, 3),
    steps: [
      step('公式', formula, null),
      step('代入', `${fmtNum(ev, 0)} / ${fmtNum(isSchedule ? pv : ac, 0)}`, answer),
    ],
    note:
      answer >= 1
        ? `1以上なので${isSchedule ? '予定より進んでいる' : '効率よくコストを使えている'}。指数は「1以上が良い」。`
        : `1未満なので${isSchedule ? '予定より遅れている' : 'コスト効率が悪い'}。指数は「1以上が良い」。`,
  };
}

// --- 完成時総コスト見積（EAC） ------------------------------------------
function genEac(rng) {
  const { pv, ev, ac } = baseValues(rng);
  const bac = round(pv * rng.pick([1.5, 2, 2.5, 3]), 0); // 完成時総予算

  const cpi = ev / ac;
  const answer = round(bac / cpi, 0); // EAC = BAC / CPI

  const asBac = bac; // 予算どおりと考える
  const multiplied = round(bac * cpi, 0); // 掛けてしまう
  const plusAc = round(bac + ac, 0);
  const remaining = round(bac - ev, 0);

  return {
    question:
      `${situation(pv, ev, ac)}\n` +
      `完成時総予算（BAC）は ${fmtManYen(bac)} である。\n` +
      `現在のコスト効率がこのまま続くと仮定したとき、完成時総コスト見積（EAC）はいくらか。`,
    hint: 'EAC = BAC ÷ CPI。効率が悪い（CPI<1）ほど、見積は予算より膨らむ。',
    answer,
    distractors: [
      { value: asBac, why: '予算どおりに終わると考えている。現在のコスト効率を反映する必要がある。' },
      { value: multiplied, why: 'CPIを掛けている。効率が悪いほど総コストは増えるので割る。' },
      { value: remaining, why: 'BAC − EV は「残作業の価値」。完成時の総コストではない。' },
      { value: plusAc, why: 'BACにACを足している。ACは既にBACの一部を消化した実績。' },
    ],
    format: (v) => fmtManYen(v),
    steps: [
      step('CPI', `${fmtNum(ev, 0)} / ${fmtNum(ac, 0)}`, round(cpi, 4)),
      step('公式', 'EAC = BAC / CPI', null),
      step('代入', `${fmtNum(bac, 0)} / ${fmtNum(round(cpi, 4), 4)}`, answer, '万円'),
    ],
    note:
      cpi < 1
        ? `CPIが1未満なので、このままでは予算${fmtManYen(bac)}を約${fmtManYen(answer - bac)}超過する見込み。`
        : `CPIが1以上なので、このままなら予算${fmtManYen(bac)}を下回る見込み。`,
  };
}

// ===== src/core/generators/finance.js ============================
// 損益分岐点・ROI・正味現在価値
// 落とし穴：変動費率と限界利益率の取り違え（合計1になる関係）、
// 損益分岐点「売上高」と「販売数量」の混同。


register({
  id: 'finance',
  name: '損益分岐点・ROI・NPV',
  category: 'ストラテジ系',
  tags: ['損益分岐点', '限界利益率', '変動費', 'ROI', '正味現在価値'],

  gen(rng) {
    return rng.pick([genBep, genProfit, genRoi, genNpv])(rng);
  },
});

// --- 損益分岐点売上高 ---------------------------------------------------
function genBep(rng) {
  const fixed = rng.int(10, 80) * 10; // 固定費 100〜800万円
  // 変動費率は限界利益率と別の値になるよう0.5を避ける（0.5だと両者が同値）
  const varRate = rng.pick([0.2, 0.25, 0.3, 0.4, 0.6, 0.7, 0.75]);
  const marginRate = round(1 - varRate, 4);

  const answer = round(fixed / marginRate, 4);

  const byVarRate = round(fixed / varRate, 4); // 変動費率で割る
  const times = round(fixed * marginRate, 4); // 掛けてしまう
  const asFixed = fixed; // 固定費をそのまま答える
  const plusFixed = round(fixed / marginRate + fixed, 4);

  return {
    question:
      `ある製品の固定費が ${fmtManYen(fixed)}、変動費率が ${fmtPct(varRate, 0)} である。\n` +
      `損益分岐点売上高はいくらか。`,
    hint: '限界利益率＝1−変動費率。固定費をその率で割る。',
    answer,
    distractors: [
      { value: byVarRate, why: '変動費率で割っている。割るのは限界利益率（1−変動費率）。' },
      { value: times, why: '掛けている。固定費を回収するには売上が固定費より大きく必要なので割る。' },
      { value: plusFixed, why: '固定費を二重に足している。損益分岐点売上高の式に既に含まれている。' },
      { value: asFixed, why: '固定費をそのまま答えている。売上のうち変動費に消える分があるので、より多く売る必要がある。' },
    ],
    format: (v) => fmtManYen(v),
    steps: [
      step('限界利益率', `1 − ${fmtNum(varRate, 2)}`, marginRate),
      step('公式', '損益分岐点売上高 = 固定費 / 限界利益率', null),
      step('代入', `${fixed} / ${fmtNum(marginRate, 2)}`, answer, '万円'),
    ],
    note:
      `売上${fmtManYen(answer)}のとき、変動費${fmtManYen(answer * varRate)}＋固定費${fmtManYen(fixed)}で利益がちょうど0になる。`,
  };
}

// --- 目標利益を達成する売上高 -------------------------------------------
function genProfit(rng) {
  const fixed = rng.int(10, 60) * 10;
  const varRate = rng.pick([0.2, 0.25, 0.3, 0.4, 0.6, 0.7]);
  const marginRate = round(1 - varRate, 4);
  const target = rng.int(5, 30) * 10; // 目標利益 50〜300万円

  const answer = round((fixed + target) / marginRate, 4);

  const noTarget = round(fixed / marginRate, 4); // 目標利益を足し忘れる
  // varRate と marginRate の関係次第で noTarget と同値になる組がある
  // （例：固定費460・変動費率60% だとどちらも1150）。誤答を厚めに用意して吸収する。
  const byVarRate = round((fixed + target) / varRate, 4);
  const plusTarget = round(fixed / marginRate + target, 4); // 利益を後から足す
  const asSum = fixed + target; // 割り戻しをせず、そのまま足しただけ
  const timesMargin = round((fixed + target) * marginRate, 4); // 割らずに掛ける

  return {
    question:
      `ある製品の固定費が ${fmtManYen(fixed)}、変動費率が ${fmtPct(varRate, 0)} である。\n` +
      `${fmtManYen(target)}の利益を確保するには、売上高はいくら必要か。`,
    hint: '固定費と目標利益を合わせた額を、限界利益率で割る。',
    answer,
    distractors: [
      { value: noTarget, why: '目標利益を加えていない。これは損益分岐点売上高（利益0の場合）。' },
      { value: plusTarget, why: '目標利益を後から足している。利益分も限界利益率で割り戻す必要がある。' },
      { value: byVarRate, why: '変動費率で割っている。割るのは限界利益率（1−変動費率）。' },
      { value: asSum, why: '固定費と目標利益を足しただけ。売上の一部は変動費に消えるので割り戻しが要る。' },
      { value: timesMargin, why: '限界利益率を掛けている。必要な売上を求めるので割るのが正しい。' },
    ],
    format: (v) => fmtManYen(v),
    steps: [
      step('限界利益率', `1 − ${fmtNum(varRate, 2)}`, marginRate),
      step('回収すべき額', `${fixed} + ${target}`, fixed + target, '万円'),
      step('必要な売上高', `${fixed + target} / ${fmtNum(marginRate, 2)}`, answer, '万円'),
    ],
    note:
      '目標利益は「固定費と同じように回収すべき額」として扱う。' +
      '売上の一部は変動費に消えるので、割り戻しが必要。',
  };
}

// --- ROI ----------------------------------------------------------------
function genRoi(rng) {
  const invest = rng.int(10, 50) * 100; // 投資額 1000〜5000万円
  const gain = round(invest * rng.pick([0.1, 0.15, 0.2, 0.25, 0.3, 0.4]), 0); // 利益

  const answer = round(gain / invest, 4);

  const withInvest = round((gain + invest) / invest, 4); // 回収率と混同（＝ROI+1）
  const doubled = round((gain / invest) * 2, 4); // 2倍に見積もる
  // 注：gain − invest（差額）は率ではないため、%として表示すると
  //     「−276000%」のような明らかにおかしい選択肢になる。率どうしで比較できる誤答だけを使う。
  const halfRate = round(gain / invest / 2, 4); // 期間で割ってしまう
  const timesTen = round((gain / invest) * 10, 4); // 桁を1つ間違える

  return {
    question:
      `${fmtManYen(invest)}を投資し、${fmtManYen(gain)}の利益が得られた。\n` +
      `このときのROI（投資利益率）はいくらか。`,
    hint: 'ROI＝利益÷投資額。投資した額に対してどれだけ儲かったか。',
    answer,
    distractors: [
      { value: withInvest, why: '利益に投資額を足している（回収率）。ROIは利益だけを投資額で割る。' },
      { value: halfRate, why: '何かで割って半分にしている。ROIは利益を投資額で割るだけ。' },
      { value: timesTen, why: '桁を1つ間違えている。割り算の結果をそのまま率として読む。' },
      { value: doubled, why: '2倍に見積もっている。利益をそのまま投資額で割るだけでよい。' },
    ],
    format: (v) => fmtPct(v, 1),
    steps: [
      step('公式', 'ROI = 利益 / 投資額', null),
      step('代入', `${gain} / ${invest}`, answer),
    ],
    note: `投資額の${fmtPct(answer, 1)}が利益として返ってきた計算。ROIが高いほど投資効率が良い。`,
  };
}

// --- 正味現在価値（NPV） ------------------------------------------------
function genNpv(rng) {
  const rate = rng.pick([0.05, 0.1]); // 割引率
  const years = 2; // 2年分（手計算できる範囲に留める）
  const cash = rng.int(10, 40) * 10; // 各年のキャッシュフロー
  const invest = rng.int(10, 50) * 10;

  // 現在価値 = Σ CF/(1+r)^n
  const pv1 = cash / (1 + rate);
  const pv2 = cash / Math.pow(1 + rate, 2);
  const pvTotal = pv1 + pv2;
  const answer = round(pvTotal - invest, 2);

  const noDiscount = round(cash * years - invest, 2); // 割り引かない
  const noInvest = round(pvTotal, 2); // 投資額を引き忘れる
  const multiplied = round(cash * (1 + rate) + cash * Math.pow(1 + rate, 2) - invest, 2); // 掛けてしまう

  return {
    question:
      `初期投資 ${fmtManYen(invest)}のプロジェクトがあり、` +
      `1年後と2年後にそれぞれ ${fmtManYen(cash)}のキャッシュフローが見込まれる。\n` +
      `割引率を ${fmtPct(rate, 0)} とするとき、正味現在価値（NPV）はおよそいくらか。`,
    hint: '将来のお金を現在価値に割り引いてから合計し、最後に初期投資を引く。',
    answer,
    distractors: [
      { value: noDiscount, why: '割引をしていない。将来のお金は現在価値に直す必要がある。' },
      { value: noInvest, why: '初期投資を引いていない。「正味」なので投資額を差し引く。' },
      { value: multiplied, why: '(1+r)を掛けている。将来価値→現在価値は割る方向。' },
    ],
    format: (v) => fmtManYen(v),
    steps: [
      step('1年後の現在価値', `${cash} / 1.${String(rate * 100).padStart(2, '0')}`, round(pv1, 2), '万円'),
      step('2年後の現在価値', `${cash} / 1.${String(rate * 100).padStart(2, '0')}²`, round(pv2, 2), '万円'),
      step('現在価値の合計', `${fmtNum(pv1, 2)} + ${fmtNum(pv2, 2)}`, round(pvTotal, 2), '万円'),
      step('NPV', `${fmtNum(pvTotal, 2)} − ${invest}`, answer, '万円'),
    ],
    note:
      answer >= 0
        ? 'NPVがプラスなので、この投資は割引率を上回るリターンがあり採算が合う。'
        : 'NPVがマイナスなので、この割引率のもとでは採算が合わない。',
  };
}

// ===== src/core/generators/index.js ==============================
// 全ジェネレータの読み込み口。
// import した順に registry へ並ぶので、ここの順序がUIの分野一覧の順序になる。

// ===== src/core/store.js =========================================
// 保存層の抽象化。
// localStorage を直接叩かないのは、将来アプリ化・サーバ同期に切り替えるとき
// ここだけ差し替えれば済むようにするため。UI側は必ずこの API を経由する。

const KEY = 'ap-kit:v1';

// localStorage が使えない環境（file:// のSafari、プライベートモード等）でも
// 落ちずに動くよう、メモリへフォールバックする。
let memory = null;

function backend() {
  if (memory) return null;
  try {
    const t = '__ap_kit_probe__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return localStorage;
  } catch {
    memory = new Map();
    return null;
  }
}

function readAll() {
  const b = backend();
  const raw = b ? b.getItem(KEY) : memory.get(KEY);
  if (!raw) return {};
  try {
    return JSON.parse(raw);
  } catch {
    return {};
  }
}

function writeAll(obj) {
  const raw = JSON.stringify(obj);
  const b = backend();
  if (b) {
    try {
      b.setItem(KEY, raw);
      return true;
    } catch {
      // 容量超過など。データを失うよりメモリで継続する。
      memory = new Map();
    }
  }
  memory.set(KEY, raw);
  return false;
}

const store = {
  get(key, fallback = null) {
    const all = readAll();
    return key in all ? all[key] : fallback;
  },
  set(key, value) {
    const all = readAll();
    all[key] = value;
    return writeAll(all);
  },
  update(key, fn, fallback = null) {
    const cur = store.get(key, fallback);
    const nextValue = fn(cur);
    store.set(key, nextValue);
    return nextValue;
  },
  clear() {
    writeAll({});
  },
};

// --- 成績の記録 ---------------------------------------------------------
// 形: { [generatorId]: { correct, total, recent: [{ ts, ok, seed }] } }

const STATS = 'stats';
const RECENT_MAX = 30;

function recordAnswer({ generatorId, ok, seed, ts = Date.now() }) {
  return store.update(
    STATS,
    (stats) => {
      const s = stats || {};
      const e = s[generatorId] || { correct: 0, total: 0, recent: [] };
      e.total += 1;
      if (ok) e.correct += 1;
      e.recent.unshift({ ts, ok, seed });
      e.recent = e.recent.slice(0, RECENT_MAX);
      s[generatorId] = e;
      return s;
    },
    {}
  );
}

function getStats() {
  return store.get(STATS, {}) || {};
}

function resetStats() {
  store.set(STATS, {});
}

// ===== src/sim/uptime.js =========================================
// 稼働率シミュレータ。
//
// ねらいは「なぜその式なのかが納得できない」を解くこと。
// 公式を見せる前に、**実際に何台が生き残るかを数える**。
//
//   直列の掛け算  … 100台のうちAが生きた台数のうち、さらにBも生きた台数 → 掛け算そのもの
//   並列の余事象  … 全部壊れた台数を数えて、残りが生きている台数 → 1から引く意味
//
// スライダーで数字を動かすと即座に台数が変わるので、
// 「予想 → 実際 → ズレ」を何度も繰り返せる。ここが腹落ちの入口。

const N = 100; // 並べる装置の数。100だと「％＝台数」で読めるので直感的

// 1年 = 8760時間。稼働率を「年間何時間止まるか」に翻訳するために使う。
const HOURS_PER_YEAR = 8760;

const uptimeSim = {
  id: 'uptime',
  name: '稼働率',

  html: `
    <p class="muted">
      装置を100台ぶん並べて、実際に何台が動いているかを数えます。<br>
      <b>式を覚える前に、なぜその式になるのかを目で確かめてください。</b>
    </p>

    <div class="ctrl">
      <label>
        つなぎ方
        <span class="seg" id="up-mode">
          <button type="button" class="chip" data-mode="serial" aria-pressed="true">直列（全部必要）</button>
          <button type="button" class="chip" data-mode="parallel" aria-pressed="false">並列（1つでOK）</button>
        </span>
        <span class="v"></span>
      </label>
      <label>
        1台の稼働率
        <input type="range" id="up-a" min="50" max="99" step="1" value="90">
        <span class="v" id="up-a-v">0.90</span>
      </label>
      <label>
        つなぐ台数
        <input type="range" id="up-n" min="2" max="5" step="1" value="2">
        <span class="v" id="up-n-v">2台</span>
      </label>
    </div>

    <div class="sim-stage">
      <div id="up-grid" class="up-grid" aria-label="100台のシステムの状態"></div>
      <div class="up-legend">
        <span><i class="sw ok"></i>動いている</span>
        <span><i class="sw ng"></i>止まっている</span>
      </div>
    </div>

    <div class="readout">
      <div class="stat"><div class="k">動いているシステム</div><div class="v" id="up-alive">—</div></div>
      <div class="stat accent"><div class="k">システム全体の稼働率</div><div class="v" id="up-rate">—</div></div>
      <div class="stat"><div class="k">1年で止まる時間</div><div class="v" id="up-down">—</div></div>
    </div>

    <div class="up-why" id="up-why"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn" id="up-reroll">もう一度ふり直す</button>
      <span class="spacer"></span>
      <button class="btn primary" data-drill="reliability">この分野の問題を解く</button>
    </div>
  `,

  mount(host) {
    const $ = (s) => host.querySelector(s);
    const grid = $('#up-grid');
    const aEl = $('#up-a');
    const nEl = $('#up-n');

    let mode = 'serial';
    // 各システム(100個)が持つ、装置ごとの「生きているか」の判定結果。
    // スライダーを動かすたびに引き直すと画面がチカチカするので、
    // 0〜1の乱数を保持しておき、しきい値との比較だけを更新する。
    let rolls = [];

    function reroll() {
      const maxN = Number(nEl.max);
      rolls = [];
      for (let i = 0; i < N; i++) {
        const row = [];
        for (let k = 0; k < maxN; k++) row.push(Math.random());
        rolls.push(row);
      }
    }

    // 100個のセルを1度だけ作る（毎回作り直すとスライダー操作が重い）
    const cells = [];
    for (let i = 0; i < N; i++) {
      const c = document.createElement('i');
      c.className = 'up-cell';
      grid.appendChild(c);
      cells.push(c);
    }

    function render() {
      const a = Number(aEl.value) / 100;
      const n = Number(nEl.value);

      $('#up-a-v').textContent = fmtNum(a, 2);
      $('#up-n-v').textContent = `${n}台`;

      // 実際に数える。ここが本体。
      let alive = 0;
      for (let i = 0; i < N; i++) {
        const devices = rolls[i].slice(0, n).map((r) => r < a); // true = その装置は動いている
        const ok =
          mode === 'serial'
            ? devices.every((d) => d) // 直列：全部動いていること
            : devices.some((d) => d); // 並列：1つでも動いていること
        if (ok) alive++;
        cells[i].className = 'up-cell ' + (ok ? 'ok' : 'ng');
      }

      const theory =
        mode === 'serial' ? Math.pow(a, n) : 1 - Math.pow(1 - a, n);
      const downH = (1 - theory) * HOURS_PER_YEAR;

      $('#up-alive').textContent = `${alive} / ${N}`;
      $('#up-rate').textContent = fmtNum(theory, 4);
      $('#up-down').textContent = fmtDown(downH);
      $('#up-why').innerHTML = explainHtml(mode, a, n, theory, alive);
    }

    // 「1年で止まる時間」は単位を変えたほうが実感が湧く。
    // 0.9999 を「52分」と読み替えられて初めて、桁の違いが体に入る。
    function fmtDown(h) {
      if (h >= 24) return `${fmtNum(h / 24, 1)}日（${Math.round(h)}時間）`;
      if (h >= 1) return `${fmtNum(h, 1)}時間`;
      return `${Math.round(h * 60)}分`;
    }

    function explainHtml(m, a, n, theory, alive) {
      const pct = Math.round(a * 100);
      if (m === 'serial') {
        // 掛け算を「段階的に絞り込む」話として見せる。
        const steps = [];
        let remain = N;
        for (let k = 1; k <= n; k++) {
          const next = remain * a;
          steps.push(
            `　${k}台目まで見て、まだ全部動いている：${fmtNum(remain, 1)}台 × ${fmtNum(a, 2)} = <b>${fmtNum(next, 1)}台</b>`
          );
          remain = next;
        }
        return `
          <h4>なぜ掛け算なのか</h4>
          <p>
            100台のシステムから始めます。1台目の装置が動いているのは、そのうち約${pct}台。<br>
            <b>その${pct}台の中から</b>、さらに2台目も動いているものを数える——これが「${pct}%のさらに${pct}%」、つまり掛け算です。
          </p>
          <div class="up-calc">${steps.join('<br>')}</div>
          <p>
            計算では <b>${fmtNum(theory * N, 1)}台</b>、実際に数えたら <b>${alive}台</b>。
            ふり直すたびに多少ずれますが、だいたい一致します。<br>
            <b>絞り込むたびに減る。</b>だから直列はつなぐほど弱くなります。
          </p>`;
      }
      const allFail = Math.pow(1 - a, n);
      return `
        <h4>なぜ「1から引く」のか</h4>
        <p>
          並列は「1台でも動いていればOK」。正面から数えると、1台だけ動く場合・2台動く場合…と全部足すことになって大変です。<br>
          <b>そこで裏返します。</b>止まるのは<b>全部が同時に壊れたとき、そのときだけ</b>。
        </p>
        <div class="up-calc">
          　1台が壊れている確率：1 − ${fmtNum(a, 2)} = <b>${fmtNum(1 - a, 2)}</b><br>
          　${n}台とも壊れる：${Array(n).fill(fmtNum(1 - a, 2)).join(' × ')} = <b>${fmtNum(allFail, 5)}</b><br>
          　100台のうち全滅するのは <b>${fmtNum(allFail * N, 2)}台</b>だけ
        </div>
        <p>
          残りは全部動いているので、<b>1 − ${fmtNum(allFail, 5)} = ${fmtNum(theory, 4)}</b>。<br>
          実際に数えたら <b>${alive}台</b>が動いていました。
          1台だと${pct}%しか動かないのに、${n}台並べるだけで<b>${fmtPct(theory, 1)}</b>まで上がります。
        </p>`;
    }

    // --- イベント ---
    host.querySelectorAll('#up-mode .chip').forEach((b) => {
      b.addEventListener('click', () => {
        mode = b.dataset.mode;
        host.querySelectorAll('#up-mode .chip').forEach((x) =>
          x.setAttribute('aria-pressed', String(x.dataset.mode === mode))
        );
        render();
      });
    });

    aEl.addEventListener('input', render);
    nEl.addEventListener('input', render);
    $('#up-reroll').addEventListener('click', () => {
      reroll();
      render();
    });

    reroll();
    render();

    // このシミュレータはタイマーを持たないので、後始末は不要
    return null;
  },
};

// ===== src/sim/queue.js ==========================================
// 待ち行列シミュレータ（M/M/1）
//
// 狙い：ρが1に近づくと待ち時間が「急に」爆発することを体感させる。
// 公式 Tw=ρ/(1−ρ)·Ts を暗記しても、この非線形さは実感しにくい。
// 実測値と理論値を並べて出すことで、公式が現実の挙動と一致することも同時に見せる。

const queueSim = {
  id: 'queue',
  name: '待ち行列',
  drillId: 'queue', // 「この分野を解く」の飛び先

  html: `
    <p class="muted">
      窓口が1つの行列（M/M/1）。客はランダムに到着し、処理時間もばらつく。
      利用率 ρ を上げていくと、待ち時間がどう変わるかを見る。
    </p>
    <div class="sim-stage">
      <svg id="qsim-canvas" viewBox="0 0 600 130" style="width:100%;min-width:360px;height:auto">
        <g id="qsim-queue"></g>
        <rect x="470" y="40" width="70" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="505" y="70" text-anchor="middle" font-size="13" fill="currentColor">窓口</text>
        <circle id="qsim-serving" cx="505" cy="65" r="11" fill="#2f6fd0" opacity="0"/>
        <text x="20" y="110" font-size="12" fill="currentColor" opacity="0.6">← 待っている客</text>
      </svg>
    </div>
    <div class="ctrl">
      <label>
        <span>到着の多さ ρ</span>
        <input type="range" id="qsim-rho" min="10" max="95" step="5" value="50">
        <span class="v" id="qsim-rho-v">0.50</span>
      </label>
      <label>
        <span>再生速度</span>
        <input type="range" id="qsim-speed" min="1" max="80" step="1" value="30">
        <span class="v" id="qsim-speed-v">×30</span>
      </label>
    </div>
    <div class="readout">
      <div class="stat"><div class="k">行列の長さ</div><div class="v" id="qsim-len">0</div></div>
      <div class="stat"><div class="k">平均待ち時間（実測）</div><div class="v" id="qsim-measured">–</div></div>
      <div class="stat accent"><div class="k">平均待ち時間（理論値）</div><div class="v" id="qsim-theory">–</div></div>
      <div class="stat"><div class="k">処理した客</div><div class="v" id="qsim-done">0</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="qsim-reset">統計をリセット</button>
      <span class="spacer"></span>
      <button class="btn primary" data-drill="queue">この分野の問題を解く</button>
    </div>
    <div class="note" id="qsim-note"></div>
  `,

  mount(root) {
    const $ = (s) => root.querySelector(s);

    const TS = 1.0; // 平均サービス時間（秒・シミュレーション内時間）
    let rho = 0.5;
    // 既定は×30。等倍だと実測平均が出るまで（20人処理）に数十秒かかって
    // 「動いていない」ように見えるため、最初から実測値が出る速さにしておく。
    let speed = 30;

    let queue = []; // 待っている客の到着時刻
    let serving = null; // { finishAt }
    let now = 0;
    let nextArrival = 0;
    let doneCount = 0;
    let waitSum = 0;
    let raf = null; // setInterval のハンドル

    // 指数分布に従う乱数（M/M/1の到着間隔・サービス時間はこれ）
    const expRand = (mean) => -Math.log(1 - Math.random()) * mean;

    function reset(keepParams) {
      queue = [];
      serving = null;
      now = 0;
      nextArrival = expRand(TS / rho);
      doneCount = 0;
      waitSum = 0;
      if (!keepParams) render();
    }

    function stepSim(dt) {
      // dt 秒ぶん進める。イベントは順に処理する。
      let remaining = dt;
      while (remaining > 0) {
        const tArrival = nextArrival - now;
        const tFinish = serving ? serving.finishAt - now : Infinity;
        const tNext = Math.min(tArrival, tFinish, remaining);

        now += tNext;
        remaining -= tNext;

        if (serving && now >= serving.finishAt - 1e-9) {
          waitSum += serving.waited;
          doneCount++;
          serving = null;
        }
        if (now >= nextArrival - 1e-9) {
          queue.push(now);
          nextArrival = now + expRand(TS / rho);
        }
        // 窓口が空いていれば次の客を取る
        if (!serving && queue.length) {
          const arrivedAt = queue.shift();
          serving = { finishAt: now + expRand(TS), waited: now - arrivedAt };
        }
        if (tNext === 0 && remaining > 0) {
          // 同時刻イベントの処理が終わったら次へ（無限ループ防止）
          if (tArrival > 0 && tFinish > 0) break;
        }
      }
    }

    function theory() {
      return (rho / (1 - rho)) * TS;
    }

    function render() {
      // 行列の描画（最大18人まで。それ以上は「+N」で示す）
      const g = $('#qsim-queue');
      const shown = Math.min(queue.length, 18);
      let s = '';
      for (let i = 0; i < shown; i++) {
        const x = 440 - i * 24;
        s += `<circle cx="${x}" cy="65" r="9" fill="currentColor" opacity="0.55"/>`;
      }
      if (queue.length > shown) {
        s += `<text x="${440 - shown * 24 - 14}" y="70" text-anchor="end" font-size="13" fill="currentColor">+${
          queue.length - shown
        }</text>`;
      }
      g.innerHTML = s;
      $('#qsim-serving').setAttribute('opacity', serving ? '1' : '0');

      $('#qsim-len').textContent = String(queue.length);
      $('#qsim-done').textContent = String(doneCount);
      $('#qsim-theory').textContent = theory().toFixed(2) + '秒';
      // 実測は数がたまるまで出さない（少数だと理論値から大きくずれて誤解を生む）
      $('#qsim-measured').textContent =
        doneCount >= 20 ? (waitSum / doneCount).toFixed(2) + '秒' : '計測中…';

      const t = theory();
      let msg =
        `ρ=${rho.toFixed(2)} では、待ち時間は処理時間の ${(rho / (1 - rho)).toFixed(2)} 倍（${t.toFixed(2)}秒）。`;
      if (rho >= 0.85) {
        // 実測が理論値へ収束するのに時間がかかる領域。
        // 「値が合わない＝バグ」と誤解されないよう、性質として説明しておく。
        msg +=
          ' ρが0.9に近づくと待ち時間が急激に伸びる。これが「混雑すると急に遅くなる」正体。' +
          'この領域は待ち時間のばらつきも大きく、実測値が理論値に近づくまでかなりの客数を要する。';
      } else {
        msg += ' ρを0.9以上に上げてみると、待ち時間の伸び方が急になるのが分かる。';
      }
      $('#qsim-note').textContent = msg;
    }

    // requestAnimationFrame ではなく setInterval で回す。
    // rAF はタブが裏に回ると停止し、戻ってきたときに一気に時間が飛ぶ。
    // ここでは「一定間隔で少しずつ進める」ほうが挙動が素直で、裏に回しても破綻しない。
    const TICK_MS = 50;

    function loop() {
      const dtReal = TICK_MS / 1000;
      stepSim(dtReal * speed);
      render();
    }

    $('#qsim-rho').addEventListener('input', (e) => {
      rho = Number(e.target.value) / 100;
      $('#qsim-rho-v').textContent = rho.toFixed(2);
      // ρを変えたら実測値は意味を失うのでリセットする
      reset(true);
      render();
    });
    $('#qsim-speed').addEventListener('input', (e) => {
      speed = Number(e.target.value);
      $('#qsim-speed-v').textContent = '×' + speed;
    });
    $('#qsim-reset').addEventListener('click', () => reset());

    reset();
    raf = setInterval(loop, TICK_MS);

    // シミュレータを切り替えたら必ず止める（放置すると裏で回り続ける）
    return () => {
      if (raf) clearInterval(raf);
      raf = null;
    };
  },
};

// ===== src/sim/subnet.js =========================================
// サブネット・ビット可視化
//
// 狙い：プレフィクス長を動かすと32ビットのどこで線が引かれるかを目で見る。

        <input type="text" id="snsim-ip" value="192.168.10.200"
               inputmode="decimal" spellcheck="false"
               style="font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);width:100%">
        <span class="v" id="snsim-ipmsg"></span>
      </label>
      <label>
        <span>プレフィクス長</span>
        <input type="range" id="snsim-prefix" min="8" max="30" step="1" value="26">
        <span class="v" id="snsim-prefix-v">/26</span>
      </label>
    </div>
    <div class="sim-stage">
      <div id="snsim-bits" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:2.1;white-space:nowrap"></div>
    </div>
    <div class="readout">
      <div class="stat"><div class="k">サブネットマスク</div><div class="v" id="snsim-mask" style="font-size:15px">–</div></div>
      <div class="stat"><div class="k">ネットワークアドレス</div><div class="v" id="snsim-net" style="font-size:15px">–</div></div>
      <div class="stat"><div class="k">ブロードキャスト</div><div class="v" id="snsim-bc" style="font-size:15px">–</div></div>
      <div class="stat accent"><div class="k">収容ホスト数</div><div class="v" id="snsim-hosts">–</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <span class="spacer"></span>
      <button class="btn primary" data-drill="subnet">この分野の問題を解く</button>
    </div>
    <div class="note" id="snsim-note"></div>
  `,

  mount(root) {
    const $ = (s) => root.querySelector(s);

    const parseIp = (s) => {
      const m = String(s).trim().split('.');
      if (m.length !== 4) return null;
      const o = m.map((x) => Number(x));
      if (o.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return null;
      return ((o[0] << 24) >>> 0) + (o[1] << 16) + (o[2] << 8) + o[3];
    };
    const toIp = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
    const maskOf = (p) => (p === 0 ? 0 : (0xffffffff << (32 - p)) >>> 0);

    function render() {
      const prefix = Number($('#snsim-prefix').value);
      $('#snsim-prefix-v').textContent = '/' + prefix;

      const ip = parseIp($('#snsim-ip').value);
      if (ip === null) {
        $('#snsim-ipmsg').textContent = '形式が不正';
        return;
      }
      $('#snsim-ipmsg').textContent = '';

      const mask = maskOf(prefix);
      const net = (ip & mask) >>> 0;
      const size = Math.pow(2, 32 - prefix);
      const bc = (net + size - 1) >>> 0;
      const hosts = Math.max(0, size - 2);

      // ビット列を色分けして描く。オクテット区切りに空白を入れる。
      const bits = ip.toString(2).padStart(32, '0');
      let html = '';
      for (let i = 0; i < 32; i++) {
        if (i > 0 && i % 8 === 0) html += '<span style="opacity:.35"> . </span>';
        const isNet = i < prefix;
        const color = isNet ? 'var(--accent)' : 'var(--warn)';
        const weight = isNet ? '700' : '400';
        // プレフィクス境界に縦線を入れる
        const border =
          i === prefix ? 'border-left:2px solid var(--ng);margin-left:-1px;padding-left:2px;' : '';
        html += `<span style="color:${color};font-weight:${weight};${border}">${bits[i]}</span>`;
      }
      html +=
        `<div style="margin-top:6px;font-size:12px;font-family:inherit">` +
        `<span style="color:var(--accent);font-weight:700">■</span> ネットワーク部 ${prefix}ビット　` +
        `<span style="color:var(--warn);font-weight:700">■</span> ホスト部 ${32 - prefix}ビット</div>`;
      $('#snsim-bits').innerHTML = html;

      $('#snsim-mask').textContent = toIp(mask);
      $('#snsim-net').textContent = toIp(net);
      $('#snsim-bc').textContent = toIp(bc);
      $('#snsim-hosts').textContent = hosts.toLocaleString('ja-JP') + '台';

      $('#snsim-note').textContent =
        `このサブネットの範囲は ${toIp(net)} 〜 ${toIp(bc)}（全${size.toLocaleString('ja-JP')}個）。` +
        `先頭のネットワークアドレスと末尾のブロードキャストアドレスは使えないので、割り当てられるのは ${hosts.toLocaleString(
          'ja-JP'
        )} 台。`;
    }

    $('#snsim-prefix').addEventListener('input', render);
    $('#snsim-ip').addEventListener('input', render);
    render();

    return () => {};
  },
};

// ===== src/sim/page.js ===========================================
// ページ置換アルゴリズムの比較（FIFO / LRU / OPT）
//
// 狙い：同じ参照列に対して3方式を横並びで動かし、フォールト数の差を目で見る。
// OPT（最適・未来を知っている前提）が理論上の下限であること、
// LRUがそれにどれだけ近いかが分かると、キャッシュ設計の話が腑に落ちる。

const pageSim = {
  id: 'page',
  name: 'ページ置換',
  drillId: null, // 対応するドリル分野は今回のスコープ外（拡張候補）

  html: `
    <p class="muted">
      同じ参照列を FIFO・LRU・OPT の3方式に流し、ページフォールトの起き方を比べる。
      OPT は「未来の参照を知っている」理想の方式で、これ以上は減らせないという下限を示す。
    </p>
    <div class="ctrl">
      <label>
        <span>フレーム数</span>
        <input type="range" id="pgsim-frames" min="2" max="5" step="1" value="3">
        <span class="v" id="pgsim-frames-v">3</span>
      </label>
      <label>
        <span>参照列</span>
        <input type="text" id="pgsim-seq" value="7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1"
               inputmode="numeric" spellcheck="false"
               style="font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);width:100%">
        <span class="v"><button class="btn" id="pgsim-rand" style="padding:4px 10px;font-size:13px">ランダム</button></span>
      </label>
    </div>
    <div class="row" style="margin-top:4px">
      <button class="btn" id="pgsim-prev">◀ 戻る</button>
      <button class="btn primary" id="pgsim-play">▶ 再生</button>
      <button class="btn" id="pgsim-next">進む ▶</button>
      <button class="btn" id="pgsim-reset">最初から</button>
      <span class="muted" id="pgsim-pos"></span>
    </div>
    <div class="sim-stage" id="pgsim-stage"></div>
    <div class="readout" id="pgsim-readout"></div>
    <div class="note" id="pgsim-note"></div>
  `,

  mount(root) {
    const $ = (s) => root.querySelector(s);

    let seq = [];
    let frames = 3;
    let step = 0; // 何個目まで処理したか
    let timer = null;

    // --- 各アルゴリズムを step 個目まで実行した状態を返す（純関数） -----
    //
    // 毎回最初から計算し直している。参照列はせいぜい数十個なので速度は問題なく、
    // 「戻る」を実装するときに履歴を持たなくて済むぶん確実。
    function simulate(algo, upto) {
      const mem = []; // フレームの中身
      const meta = []; // FIFO: 入った順、LRU: 最終参照時刻
      let faults = 0;
      let lastEvicted = null;
      let lastFault = false;

      for (let t = 0; t < upto; t++) {
        const page = seq[t];
        const hit = mem.indexOf(page) >= 0;
        lastFault = !hit;
        lastEvicted = null;

        if (hit) {
          if (algo === 'LRU') meta[mem.indexOf(page)] = t;
          continue;
        }

        faults++;

        if (mem.length < frames) {
          mem.push(page);
          meta.push(t);
          continue;
        }

        let victim = 0;
        if (algo === 'FIFO' || algo === 'LRU') {
          // FIFO: 入った時刻が最小 / LRU: 最終参照が最小
          for (let i = 1; i < mem.length; i++) if (meta[i] < meta[victim]) victim = i;
        } else {
          // OPT: 次に使われるのが最も先（または二度と使われない）ページを追い出す
          let farthest = -1;
          for (let i = 0; i < mem.length; i++) {
            let nextUse = Infinity;
            for (let k = t + 1; k < seq.length; k++) {
              if (seq[k] === mem[i]) {
                nextUse = k;
                break;
              }
            }
            if (nextUse > farthest) {
              farthest = nextUse;
              victim = i;
            }
          }
        }

        lastEvicted = mem[victim];
        mem[victim] = page;
        meta[victim] = t;
      }

      return { mem: mem.slice(), faults, lastEvicted, lastFault };
    }

    const ALGOS = [
      { id: 'FIFO', label: 'FIFO（入った順に追い出す）' },
      { id: 'LRU', label: 'LRU（最後に使ったのが古い順）' },
      { id: 'OPT', label: 'OPT（最適・未来を知っている）' },
    ];

    function render() {
      $('#pgsim-frames-v').textContent = String(frames);
      $('#pgsim-pos').textContent = `${step} / ${seq.length} 件目まで`;

      // 参照列の表示（現在位置を強調）
      let seqHtml =
        '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;margin-bottom:12px;white-space:nowrap">';
      seq.forEach((p, i) => {
        const isCur = i === step - 1;
        const done = i < step;
        seqHtml +=
          `<span style="display:inline-block;width:26px;text-align:center;border-radius:4px;` +
          (isCur
            ? 'background:var(--accent);color:#fff;font-weight:700;'
            : done
            ? 'opacity:.45;'
            : 'opacity:.85;') +
          `">${p}</span>`;
      });
      seqHtml += '</div>';

      let body = seqHtml;
      const results = {};

      for (const a of ALGOS) {
        const r = simulate(a.id, step);
        results[a.id] = r;

        const cells = [];
        for (let i = 0; i < frames; i++) {
          const v = r.mem[i];
          const filled = v !== undefined;
          cells.push(
            `<div style="width:44px;height:38px;border-radius:6px;display:grid;place-items:center;` +
              `font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;` +
              `border:1px solid var(--line);background:${filled ? 'var(--panel)' : 'transparent'};` +
              `color:${filled ? 'var(--text)' : 'var(--muted)'}">${filled ? v : '·'}</div>`
          );
        }

        body +=
          `<div style="margin-bottom:14px">` +
          `<div style="font-size:13px;color:var(--muted);margin-bottom:5px">${a.label}` +
          (step > 0 && r.lastFault
            ? ` <span style="color:var(--ng);font-weight:700">フォールト</span>` +
              (r.lastEvicted !== null && r.lastEvicted !== undefined
                ? `<span style="color:var(--muted)">（${r.lastEvicted} を追い出し）</span>`
                : '')
            : step > 0
            ? ` <span style="color:var(--ok);font-weight:700">ヒット</span>`
            : '') +
          `</div>` +
          `<div style="display:flex;gap:6px">${cells.join('')}</div>` +
          `</div>`;
      }

      $('#pgsim-stage').innerHTML = body;

      $('#pgsim-readout').innerHTML = ALGOS.map((a) => {
        const f = results[a.id].faults;
        const isBest = f === Math.min(...ALGOS.map((x) => results[x.id].faults));
        return (
          `<div class="stat${isBest ? ' accent' : ''}">` +
          `<div class="k">${a.id} のフォールト数</div><div class="v">${f}</div></div>`
        );
      }).join('');

      const fifo = results.FIFO.faults;
      const lru = results.LRU.faults;
      const opt = results.OPT.faults;
      $('#pgsim-note').textContent =
        step < seq.length
          ? '「進む」で1件ずつ、「再生」で自動的に進む。フレームが埋まったあとの追い出し方の違いに注目。'
          : `最後まで実行：FIFO ${fifo}回、LRU ${lru}回、OPT ${opt}回。` +
            `OPTは未来を知っている前提なので実装できないが、「これ以上は減らせない」下限を示す。` +
            (lru <= fifo
              ? ' LRUは直近の使用履歴を使う分、FIFOより賢く振る舞うことが多い。'
              : ' この参照列ではFIFOのほうが良い結果になった。LRUが常に勝つとは限らない。');
    }

    function setSeq(text) {
      const parsed = String(text)
        .split(/[^0-9]+/)
        .filter((s) => s !== '')
        .map(Number)
        .slice(0, 30);
      seq = parsed.length ? parsed : [7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2, 0, 1, 7, 0, 1];
      step = 0;
      stop();
      render();
    }

    function stop() {
      if (timer) clearInterval(timer);
      timer = null;
      $('#pgsim-play').textContent = '▶ 再生';
    }

    $('#pgsim-frames').addEventListener('input', (e) => {
      frames = Number(e.target.value);
      step = 0;
      stop();
      render();
    });
    $('#pgsim-seq').addEventListener('input', (e) => setSeq(e.target.value));
    $('#pgsim-rand').addEventListener('click', () => {
      const n = 20;
      const out = [];
      for (let i = 0; i < n; i++) out.push(Math.floor(Math.random() * 6));
      $('#pgsim-seq').value = out.join(' ');
      setSeq(out.join(' '));
    });
    $('#pgsim-next').addEventListener('click', () => {
      if (step < seq.length) step++;
      stop();
      render();
    });
    $('#pgsim-prev').addEventListener('click', () => {
      if (step > 0) step--;
      stop();
      render();
    });
    $('#pgsim-reset').addEventListener('click', () => {
      step = 0;
      stop();
      render();
    });
    $('#pgsim-play').addEventListener('click', () => {
      if (timer) {
        stop();
        return;
      }
      if (step >= seq.length) step = 0;
      $('#pgsim-play').textContent = '❚❚ 停止';
      timer = setInterval(() => {
        if (step >= seq.length) {
          stop();
          render();
          return;
        }
        step++;
        render();
      }, 700);
    });

    setSeq($('#pgsim-seq').value);

    return () => stop();
  },
};

// ===== src/sim/index.js ==========================================
// シミュレータの登録と切り替え。
// 表示中のものだけ mount し、切り替え時に unmount する
// （待ち行列は requestAnimationFrame を回し続けるため、放置すると電池を食う）。




// 稼働率を先頭に置く。「なぜその式なのか」が一番つまずきやすく、
// かつ他の分野（並列＝余事象の考え方）にも効くため。
const SIMS = [uptimeSim, queueSim, subnetSim, pageSim];

function mountSimulators() {
  const nav = document.querySelector('#sim-nav');
  const host = document.querySelector('#sim-host');
  if (!nav || !host) return;

  let unmount = null;
  let currentId = null;

  function show(id) {
    if (currentId === id) return;
    if (unmount) {
      unmount();
      unmount = null;
    }
    const sim = SIMS.find((s) => s.id === id) || SIMS[0];
    currentId = sim.id;

    Array.from(nav.children).forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.sim === sim.id))
    );

    host.innerHTML = sim.html;

    // 「この分野の問題を解く」ボタンはドリルタブへの遷移イベントを投げる
    host.querySelectorAll('[data-drill]').forEach((b) => {
      b.addEventListener('click', () => {
        window.dispatchEvent(
          new CustomEvent('ap:drill', { detail: { genId: b.dataset.drill } })
        );
      });
    });

    unmount = sim.mount(host) || null;
  }

  nav.innerHTML = '';
  for (const s of SIMS) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.sim = s.id;
    b.textContent = s.name;
    b.addEventListener('click', () => show(s.id));
    nav.appendChild(b);
  }

  show(SIMS[0].id);
}
