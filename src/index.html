<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fd0">
<meta name="description" content="応用情報技術者試験・科目Aの計算問題を無限に生成するドリルと、待ち行列・サブネット・ページ置換の可視化シミュレータ。">
<title>応用情報ドリル</title>
<!--BUILD:MANIFEST-->
<style>/*BUILD:CSS*/</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="title">
    <h1>応用情報ドリル</h1>
    <span class="sub">ゼロから読める入門レッスン ＋ 無限に解ける計算ドリル</span>
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="learn" role="tab" aria-selected="true">はじめから</button>
    <button data-tab="drill" role="tab" aria-selected="false">ドリル</button>
    <button data-tab="sim" role="tab" aria-selected="false">シミュレータ</button>
    <button data-tab="stats" role="tab" aria-selected="false">成績</button>
  </nav>
</header>

<!-- はじめから（初学者向けレッスン） -->
<section data-panel="learn">
  <div id="learn-host"></div>
</section>

<!-- ドリル -->
<section data-panel="drill" class="hidden">
  <div class="panel">
    <div class="row">
      <strong style="font-size:14px">出題する分野</strong>
      <span class="spacer"></span>
      <span class="muted">選んだ分野からランダムに出題します</span>
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="panel" id="question"></div>

  <div class="row" style="margin-top:14px">
    <button class="btn" id="retry" title="同じ問題をもう一度表示します">この問題をもう一度</button>
    <span class="spacer"></span>
    <button class="btn primary" id="next">次の問題</button>
  </div>
</section>

<!-- シミュレータ -->
<section data-panel="sim" class="hidden">
  <div class="panel">
    <div class="sim-nav" id="sim-nav"></div>
    <div id="sim-host"></div>
  </div>
</section>

<!-- 成績 -->
<section data-panel="stats" class="hidden">
  <div class="panel">
    <div id="stats-summary"></div>
  </div>
  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <strong style="font-size:14px">分野別（正答率の低い順）</strong>
      <span class="spacer"></span>
      <button class="btn" id="reset-stats">成績をリセット</button>
    </div>
    <div id="stats-table"></div>
    <p class="muted" style="margin-top:14px">
      成績はこの端末の中だけに保存されます。どこにも送信されません。
    </p>
  </div>
</section>

<p class="muted" style="margin-top:28px;text-align:center;font-size:12px">
  出題は全問その場で自動生成しています（過去問の転載はありません）。<br>
  <!--BUILD:VERSION-->
</p>

</div>

<script type="module">
/*BUILD:JS*/
</script>
<!--BUILD:SW-->
</body>
</html>
